// РЕДАКТИРОВАНИЕ СООБЩЕСТВА
// ============================================================
function editCommunity() {
    if (!currentUser || communityData.ownerId !== currentUser.uid) return;
    
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal-box">
            <button class="close-modal" onclick="this.closest('.modal-overlay').remove()">×</button>
            <h3>Редактировать сообщество</h3>
            
            <div class="edit-media-row">
                <div class="edit-avatar-box">
                    <div class="preview" id="editAvatarPreview" onclick="document.getElementById('avatarInput').click()">
                        ${communityData.avatar ? `<img src="${communityData.avatar}" alt="avatar">` : `<span class="empty-avatar"><span class="material-icons" style="font-size:36px;color:var(--text-muted);">group</span></span>`}
                        <div class="upload-overlay"><span class="material-icons">photo_camera</span></div>
                    </div>
                    <div class="label">Аватар</div>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
                    <div class="edit-upload-progress" id="avatarProgress"><div class="bar" id="avatarBar"></div></div>
                </div>
                <div class="edit-cover-box">
                    <div class="preview" id="editCoverPreview" onclick="document.getElementById('coverInput').click()">
                        ${communityData.cover ? `<img src="${communityData.cover}" alt="cover">` : `<span class="empty-cover">Шапка сообщества</span>`}
                        <div class="upload-overlay"><span class="material-icons">photo_camera</span></div>
                    </div>
                    <div class="label">Шапка</div>
                    <input type="file" id="coverInput" accept="image/*" style="display:none;" onchange="handleCoverUpload(event)">
                    <div class="edit-upload-progress" id="coverProgress"><div class="bar" id="coverBar"></div></div>
                </div>
            </div>
            
            <div class="edit-field">
                <label>Название</label>
                <input type="text" id="editCommunityName" value="${escapeHtml(communityData.name || '')}">
            </div>
            <div class="edit-field">
                <label>Описание</label>
                <textarea id="editCommunityDesc">${escapeHtml(communityData.description || '')}</textarea>
            </div>
            <div class="modal-actions">
                <button class="ripple-btn outline" onclick="this.closest('.modal-overlay').remove()">Отмена</button>
                <button class="ripple-btn primary" id="saveCommunityBtn">Сохранить</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    
    document.getElementById('avatarInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const preview = document.getElementById('editAvatarPreview');
        const reader = new FileReader();
        reader.onload = function(ev) {
            preview.innerHTML = `
                <img src="${ev.target.result}" alt="avatar">
                <div class="upload-overlay"><span class="material-icons">photo_camera</span></div>
            `;
        };
        reader.readAsDataURL(file);
        window._avatarFile = file;
    });
    
    document.getElementById('coverInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const preview = document.getElementById('editCoverPreview');
        const reader = new FileReader();
        reader.onload = function(ev) {
            preview.innerHTML = `
                <img src="${ev.target.result}" alt="cover">
                <div class="upload-overlay"><span class="material-icons">photo_camera</span></div>
            `;
        };
        reader.readAsDataURL(file);
        window._coverFile = file;
    });
    
    document.getElementById('saveCommunityBtn').addEventListener('click', function() {
        const name = document.getElementById('editCommunityName').value.trim();
        const description = document.getElementById('editCommunityDesc').value.trim();
        
        if (!name) {
            alert('Введите название');
            return;
        }
        
        this.disabled = true;
        this.innerHTML = '<span class="material-icons" style="animation:spin 1s linear infinite;">refresh</span> Сохранение...';
        
        const uploadPromises = [];
        const updates = {};
        
        if (window._avatarFile) {
            const formData = new FormData();
            formData.append('key', IMGBB_API_KEY);
            formData.append('image', window._avatarFile);
            uploadPromises.push(
                fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) updates.avatar = data.data.url;
                    })
            );
        }
        
        if (window._coverFile) {
            const formData = new FormData();
            formData.append('key', IMGBB_API_KEY);
            formData.append('image', window._coverFile);
            uploadPromises.push(
                fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) updates.cover = data.data.url;
                    })
            );
        }
        
        Promise.all(uploadPromises)
            .then(() => {
                updates.name = name;
                updates.description = description || 'Нет описания';
                return db.collection('communities').doc(communityData.id).update(updates);
            })
            .then(() => {
                communityData.name = name;
                communityData.description = description || 'Нет описания';
                if (updates.avatar) communityData.avatar = updates.avatar;
                if (updates.cover) communityData.cover = updates.cover;
                modal.remove();
                renderCommunity(communityData);
                alert('Обновлено!');
            })
            .catch(err => {
                alert('Ошибка: ' + err.message);
                this.disabled = false;
                this.innerHTML = 'Сохранить';
            });
    });
