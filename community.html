<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Takean - Сообщество</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1c1c1c;
            --bg-hover: #2a2a2a;
            --bg-input: #252525;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --border-color: #2c2c2c;
            --border-light: #3a3a3a;
            --accent: #4f8cff;
            --accent-hover: #6b9fff;
            --accent-light: rgba(79, 140, 255, 0.15);
            --green: #4caf50;
            --red: #f44336;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --radius: 4px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --topbar-height: 60px;
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f0;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #e8e8e8;
            --bg-input: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --border-light: #d0d0d0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        html {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: var(--radius); }

        .container { max-width: 900px; margin: 0 auto; padding: 0 16px; width: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .flex-col { display: flex; flex-direction: column; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .gap-16 { gap: 16px; }
        .gap-24 { gap: 24px; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.4; }
            100% { transform: scale(4); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-fade { animation: fadeIn 0.25s ease-out; }
        .animate-slide { animation: slideUp 0.3s ease-out; }

        /* ===== TOP BAR ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            min-height: var(--topbar-height);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .topbar-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .topbar-logo span { color: var(--accent); }

        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .topbar-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .topbar-nav a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .topbar-nav a.active {
            color: var(--accent);
            background: var(--accent-light);
        }

        .topbar-nav a .material-icons { font-size: 20px; }
        .topbar-nav a span:not(.material-icons) { display: inline; }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .topbar-actions .material-icons {
            font-size: 22px;
            color: var(--text-secondary);
        }

        .topbar-actions .avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            overflow: hidden;
            flex-shrink: 0;
        }

        .topbar-actions .avatar-small:hover {
            border-color: var(--accent);
        }

        .topbar-actions .avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 160px;
        }

        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            padding: 6px 6px;
            width: 100%;
            min-width: 60px;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
            font-size: 12px;
        }

        .search-bar .material-icons {
            color: var(--text-muted);
            font-size: 18px;
        }

        /* ===== RIPPLE BUTTON ===== */
        .ripple-btn {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
            background: none;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius);
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
        }

        .ripple-btn .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            animation: ripple 0.5s ease-out;
            pointer-events: none;
        }

        [data-theme="light"] .ripple-btn .ripple-effect {
            background: rgba(0, 0, 0, 0.1);
        }

        .ripple-btn:hover { background: var(--bg-hover); }
        .ripple-btn:active { transform: scale(0.97); }

        .ripple-btn.primary {
            background: var(--accent);
            color: #fff;
        }
        .ripple-btn.primary:hover { background: var(--accent-hover); }

        .ripple-btn.outline {
            border: 1px solid var(--border-color);
        }
        .ripple-btn.outline:hover { background: var(--bg-hover); }

        /* ===== COMMUNITY ===== */
        .community-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            margin: 16px 0;
        }

        .community-cover {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            position: relative;
            overflow: hidden;
        }

        .community-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .community-info {
            padding: 16px 20px 20px;
        }

        .community-name-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .community-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius);
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--text-secondary);
            overflow: hidden;
            flex-shrink: 0;
        }

        .community-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .community-icon .material-icons {
            font-size: 32px;
            color: var(--text-muted);
        }

        .community-name {
            font-size: 22px;
            font-weight: 700;
        }

        .community-handle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .community-desc {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0 12px;
        }

        .community-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .community-stats .stat {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .community-stats .stat .num {
            font-weight: 700;
            color: var(--text-primary);
        }

        .community-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .community-members {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
        }

        .community-members .avatar-stack {
            display: flex;
        }

        .community-members .avatar-stack .mini-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            margin-left: -8px;
            overflow: hidden;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .community-members .avatar-stack .mini-avatar:first-child { margin-left: 0; }
        .community-members .avatar-stack .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .community-members .members-count {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 8px;
            cursor: pointer;
        }

        .community-members .members-count:hover {
            color: var(--accent);
        }

        /* ===== POST CARD ===== */
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease-out;
        }

        .post-card:hover {
            border-color: var(--border-light);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
        }

        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-user {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex: 1;
            min-width: 0;
        }

        .post-username {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .post-username:hover { color: var(--accent); }

        .post-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .post-title {
            font-size: 16px;
            font-weight: 700;
            margin: 6px 0 8px;
            line-height: 1.4;
            color: var(--text-primary);
            cursor: pointer;
        }

        .post-title:hover { color: var(--accent); }

        .post-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .post-content .mention {
            color: var(--accent);
            font-weight: 500;
            cursor: pointer;
        }

        .post-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 4px;
            margin: 8px 0;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .post-images .img-wrap {
            position: relative;
            padding-bottom: 100%;
            background: var(--bg-hover);
            overflow: hidden;
            cursor: pointer;
        }

        .post-images .img-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .post-action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .post-action-btn:hover { background: var(--bg-hover); }
        .post-action-btn .material-icons { font-size: 18px; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease-out;
            padding: 16px;
        }

        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease-out;
        }

        .modal-box .close-modal {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 24px;
            -webkit-tap-highlight-color: transparent;
        }

        .modal-box h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-user-item:hover {
            background: var(--bg-hover);
            margin: 0 -8px;
            padding: 10px 8px;
        }

        .modal-user-item:last-child { border-bottom: none; }

        .modal-user-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-hover);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .modal-user-item .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-user-item .name {
            font-weight: 600;
            font-size: 14px;
        }

        .modal-user-item .username {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: auto;
            padding: 30px 0 16px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer-brand {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
        }
        .footer-brand span { color: var(--accent); }

        .footer-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .footer-links a:hover { color: var(--accent); }

        .footer-copy {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 12px;
            text-align: center;
            width: 100%;
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading-spinner .material-icons {
            animation: spin 1s linear infinite;
            font-size: 28px;
            margin-right: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state .material-icons {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .search-bar { max-width: 120px; }
            .search-bar input { min-width: 50px; font-size: 12px; }
            .topbar-nav a { padding: 4px 8px; font-size: 12px; }
            .topbar-nav a .material-icons { font-size: 18px; }
        }

        @media (max-width: 768px) {
            .container { padding: 0 10px; }
            .topbar-logo { font-size: 17px; }
            .topbar-nav a span:not(.material-icons) { display: none; }
            .topbar-nav a { padding: 6px 8px; }
            .topbar-nav a .material-icons { font-size: 20px; }
            .search-bar { max-width: 100px; }
            .search-bar input { min-width: 40px; width: 40px; font-size: 11px; }
            .community-cover { height: 100px; }
            .community-icon { width: 48px; height: 48px; font-size: 22px; }
            .community-name { font-size: 18px; }
            .community-info { padding: 12px 16px 16px; }
            .post-card { padding: 12px; }
            .post-title { font-size: 15px; }
            .post-images { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
            .footer-inner { flex-direction: column; align-items: center; text-align: center; }
        }

        @media (max-width: 480px) {
            .topbar { padding: 4px 0; }
            .topbar-logo { font-size: 15px; }
            .topbar-nav a { padding: 4px 6px; }
            .topbar-nav a .material-icons { font-size: 18px; }
            .search-bar { max-width: 70px; }
            .search-bar input { min-width: 30px; width: 30px; padding: 4px 4px; font-size: 10px; }
            .topbar-actions .avatar-small { width: 26px; height: 26px; font-size: 10px; }
            .topbar-actions .material-icons { font-size: 18px; }
            .community-cover { height: 80px; }
            .community-icon { width: 40px; height: 40px; font-size: 18px; }
            .community-icon .material-icons { font-size: 24px; }
            .community-name { font-size: 16px; }
            .post-card { padding: 10px; }
            .post-title { font-size: 14px; }
            .post-content { font-size: 13px; }
            .modal-box { padding: 16px; margin: 8px; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="container">
        <div class="topbar-inner">
            <a href="/" class="topbar-logo">Take<span>an</span></a>
            
            <nav class="topbar-nav">
                <a href="/">
                    <span class="material-icons">home</span>
                    <span>Главная</span>
                </a>
                <a href="/search.html">
                    <span class="material-icons">search</span>
                    <span>Поиск</span>
                </a>
                <a href="/create.html">
                    <span class="material-icons">add_box</span>
                    <span>Создать</span>
                </a>
            </nav>

            <div class="topbar-actions">
                <div class="search-bar">
                    <span class="material-icons">search</span>
                    <input type="text" placeholder="Поиск..." id="globalSearch">
                </div>
                
                <button class="ripple-btn" id="themeToggle" aria-label="Переключить тему" style="padding:4px 6px;">
                    <span class="material-icons">dark_mode</span>
                </button>

                <div class="avatar-small" id="userAvatar">
                    <span>?</span>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="container" style="flex:1;">
    <div id="communityContainer">
        <div class="loading-spinner">
            <span class="material-icons">refresh</span> Загрузка сообщества...
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer-inner">
            <div>
                <div class="footer-brand">Take<span>an</span></div>
                <div style="color: var(--text-muted); font-size: 13px; margin-top: 2px;">
                    Платформа для тейков
                </div>
            </div>
            <div class="footer-links">
                <a href="/settings.html">Настройки</a>
                <a href="#" onclick="alert('Страница в разработке')">Политика конфиденциальности</a>
                <a href="#" onclick="alert('Страница в разработке')">Задать вопрос</a>
                <a href="/404.html">404</a>
            </div>
        </div>
        <div class="footer-copy">
            &copy; 2026 Takean. Все права защищены.
        </div>
    </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBDzDIwiObevnlfqfm6p9fzAvsHHpT2QZU",
    authDomain: "takean.firebaseapp.com",
    projectId: "takean",
    storageBucket: "takean.firebasestorage.app",
    messagingSenderId: "359116659063",
    appId: "1:359116659063:web:eb81859e5a8f885e546972",
    measurementId: "G-VXLM679GKK"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let communityData = null;
let communityId = null;

let currentTheme = localStorage.getItem('takean-theme') || 'dark';
document.documentElement.setAttribute('data-theme', currentTheme);

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('themeToggle').addEventListener('click', () => {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        localStorage.setItem('takean-theme', currentTheme);
        document.getElementById('themeToggle').innerHTML = 
            `<span class="material-icons">${currentTheme === 'dark' ? 'dark_mode' : 'light_mode'}</span>`;
    });

    const urlParams = new URLSearchParams(window.location.search);
    communityId = urlParams.get('id');
    
    if (communityId) {
        loadCommunity(communityId);
    } else {
        document.getElementById('communityContainer').innerHTML = `
            <div class="empty-state">
                <span class="material-icons">group_off</span>
                <h3 style="font-weight:500;">Сообщество не найдено</h3>
                <button class="ripple-btn primary" style="margin-top:12px;" onclick="window.location.href='/'">
                    На главную
                </button>
            </div>
        `;
    }

    loadUserData();
    setupEventListeners();
});

function setupEventListeners() {
    document.getElementById('globalSearch').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const q = document.getElementById('globalSearch').value.trim();
            if (q) window.location.href = `/search.html?q=${encodeURIComponent(q)}`;
        }
    });
}

function loadUserData() {
    const user = auth.currentUser;
    currentUser = user;
    
    const avatarEl = document.getElementById('userAvatar');
    if (user) {
        avatarEl.innerHTML = user.photoURL 
            ? `<img src="${user.photoURL}" alt="avatar">` 
            : `<span>${(user.displayName || '?')[0].toUpperCase()}</span>`;
        avatarEl.onclick = () => window.location.href = `/profile.html?uid=${user.uid}`;
    } else {
        avatarEl.innerHTML = '<span>?</span>';
        avatarEl.onclick = () => window.location.href = '/login.html';
    }
}

auth.onAuthStateChanged(user => { loadUserData(); });

function loadCommunity(id) {
    const container = document.getElementById('communityContainer');
    container.innerHTML = '<div class="loading-spinner"><span class="material-icons">refresh</span> Загрузка...</div>';

    db.collection('communities').doc(id).get()
        .then(doc => {
            if (!doc.exists) {
                showDemoCommunity(id);
                return;
            }
            communityData = { id: doc.id, ...doc.data() };
            document.title = `Takean - ${communityData.name || 'Сообщество'}`;
            renderCommunity(communityData);
            loadCommunityPosts(id);
        })
        .catch(() => {
            showDemoCommunity(id);
        });
}

function showDemoCommunity(id) {
    const demoData = {
        id: id,
        name: id.charAt(0).toUpperCase() + id.slice(1).replace(/_/g, ' '),
        handle: id,
        description: 'Описание сообщества будет добавлено позже.',
        avatar: null,
        cover: null,
        members: ['user1', 'user2', 'user3', 'user4', 'user5'],
        memberCount: 5,
        posts: [],
        createdAt: Date.now()
    };
    communityData = demoData;
    document.title = `Takean - ${demoData.name}`;
    renderCommunity(demoData);
    loadDemoPosts();
}

function renderCommunity(community) {
    const container = document.getElementById('communityContainer');
    const isMember = currentUser && community.members && community.members.includes(currentUser.uid);
    const displayMembers = community.members || [];
    const memberCount = community.memberCount || displayMembers.length;

    container.innerHTML = `
        <div class="community-header">
            <div class="community-cover">
                ${community.cover ? `<img src="${community.cover}" alt="cover">` : ''}
            </div>
            
            <div class="community-info">
                <div class="community-name-wrap">
                    <div class="community-icon">
                        ${community.avatar ? `<img src="${community.avatar}" alt="">` : `<span class="material-icons">group</span>`}
                    </div>
                    <div>
                        <div class="community-name">${escapeHtml(community.name)}</div>
                        <div class="community-handle">@${escapeHtml(community.handle || community.id)}</div>
                    </div>
                </div>
                
                <div class="community-desc">${escapeHtml(community.description || 'Нет описания')}</div>
                
                <div class="community-stats">
                    <span class="stat"><span class="num">${memberCount}</span> участников</span>
                    <span class="stat"><span class="num">${community.posts?.length || 0}</span> тейков</span>
                </div>
                
                <div class="community-members">
                    <div class="avatar-stack">
                        ${displayMembers.slice(0, 5).map((member, i) => `
                            <div class="mini-avatar">
                                <span>${String.fromCharCode(65 + (i % 26))}</span>
                            </div>
                        `).join('')}
                        ${displayMembers.length > 5 ? `
                            <div class="mini-avatar">+${displayMembers.length - 5}</div>
                        ` : ''}
                    </div>
                    <span class="members-count" onclick="showMembers()">
                        ${displayMembers.length} участников
                    </span>
                </div>
                
                <div class="community-actions">
                    <button class="ripple-btn ${isMember ? 'outline' : 'primary'}" onclick="toggleJoin()">
                        ${isMember ? 'Выйти' : 'Вступить'}
                    </button>
                    <button class="ripple-btn outline" onclick="createPostInCommunity()">
                        <span class="material-icons">add</span> Создать тейк
                    </button>
                </div>
            </div>
        </div>
        
        <div id="communityPosts">
            <div class="loading-spinner"><span class="material-icons">refresh</span> Загрузка тейков...</div>
        </div>
    `;
}

function loadCommunityPosts(id) {
    const container = document.getElementById('communityPosts');
    
    db.collection('posts')
        .where('communityId', '==', id)
        .orderBy('createdAt', 'desc')
        .limit(30)
        .get()
        .then(snapshot => {
            const posts = [];
            snapshot.forEach(doc => {
                posts.push({ id: doc.id, ...doc.data() });
            });
            renderPosts(posts);
        })
        .catch(() => {
            loadDemoPosts();
        });
}

function loadDemoPosts() {
    const container = document.getElementById('communityPosts');
    const demoPosts = [
        {
            id: 'demo1',
            title: 'Добро пожаловать в сообщество!',
            content: 'Это демонстрационный пост. Присоединяйтесь к обсуждениям.',
            authorName: 'Takean',
            authorAvatar: null,
            likes: [],
            commentsCount: 0,
            createdAt: { seconds: Date.now() / 1000 }
        }
    ];
    renderPosts(demoPosts);
}

function renderPosts(posts) {
    const container = document.getElementById('communityPosts');
    if (!posts || !posts.length) {
        container.innerHTML = `
            <div class="empty-state">
                <span class="material-icons">inbox</span>
                <p>В сообществе пока нет тейков</p>
                <button class="ripple-btn primary" style="margin-top:8px;" onclick="createPostInCommunity()">
                    <span class="material-icons">add</span> Создать первый тейк
                </button>
            </div>
        `;
        return;
    }

    container.innerHTML = posts.map(post => `
        <div class="post-card" onclick="window.location.href='/post.html?id=${post.id}'" style="cursor:pointer;">
            <div class="post-header">
                <div class="post-avatar" onclick="event.stopPropagation(); window.location.href='/profile.html?uid=${post.authorId}'">
                    ${post.authorAvatar ? `<img src="${post.authorAvatar}" alt="">` : `<span>${(post.authorName || '?')[0].toUpperCase()}</span>`}
                </div>
                <div class="post-user">
                    <div class="post-username" onclick="event.stopPropagation(); window.location.href='/profile.html?uid=${post.authorId}'">
                        ${post.authorName || 'Аноним'}
                    </div>
                    <div class="post-time">${post.createdAt ? new Date(post.createdAt.seconds * 1000).toLocaleDateString('ru-RU') : 'недавно'}</div>
                </div>
            </div>
            <div class="post-title">${escapeHtml(post.title || 'Без заголовка')}</div>
            <div class="post-content">${escapeHtml((post.content || '').substring(0, 200))}${(post.content || '').length > 200 ? '...' : ''}</div>
            ${post.images && post.images.length ? `
                <div class="post-images">
                    ${post.images.slice(0, 3).map(img => `
                        <div class="img-wrap"><img src="${img}" alt=""></div>
                    `).join('')}
                </div>
            ` : ''}
            <div class="post-actions">
                <span class="post-action-btn"><span class="material-icons">thumb_up</span> ${post.likes?.length || 0}</span>
                <span class="post-action-btn"><span class="material-icons">comment</span> ${post.commentsCount || 0}</span>
            </div>
        </div>
    `).join('');
}

function toggleJoin() {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    if (!communityData) return;

    const isMember = communityData.members && communityData.members.includes(currentUser.uid);
    const ref = db.collection('communities').doc(communityData.id);

    db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            let members = data.members || [];
            
            if (isMember) {
                members = members.filter(id => id !== currentUser.uid);
            } else {
                members.push(currentUser.uid);
            }
            
            transaction.update(ref, {
                members: members,
                memberCount: members.length
            });
        });
    }).then(() => {
        if (isMember) {
            communityData.members = (communityData.members || []).filter(id => id !== currentUser.uid);
        } else {
            communityData.members = [...(communityData.members || []), currentUser.uid];
        }
        communityData.memberCount = communityData.members.length;
        renderCommunity(communityData);
    }).catch(err => alert('Ошибка: ' + err.message));
}

function showMembers() {
    if (!communityData || !communityData.members || !communityData.members.length) {
        alert('Нет участников');
        return;
    }

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal-box">
            <button class="close-modal" onclick="this.closest('.modal-overlay').remove()">×</button>
            <h3>Участники сообщества</h3>
            <div id="membersList">
                <div class="loading-spinner"><span class="material-icons">refresh</span></div>
            </div>
        </div>
    `;
    document.body.appendChild(modal);

    const list = modal.querySelector('#membersList');
    Promise.all(communityData.members.map(id => 
        db.collection('users').doc(id).get().then(doc => ({ id, data: doc.data() }))
    )).then(results => {
        list.innerHTML = results.filter(r => r.data).map(r => `
            <div class="modal-user-item" onclick="window.location.href='/profile.html?uid=${r.id}'">
                <div class="avatar">
                    ${r.data.avatar ? `<img src="${r.data.avatar}" alt="">` : `<span>${(r.data.username || '?')[0].toUpperCase()}</span>`}
                </div>
                <div>
                    <div class="name">${r.data.username || 'Аноним'}</div>
                    <div class="username">@${r.data.username || 'anonymous'}</div>
                </div>
            </div>
        `).join('');
    }).catch(() => {
        list.innerHTML = '<div class="empty-state"><span class="material-icons">error</span><p>Ошибка загрузки</p></div>';
    });
}

function createPostInCommunity() {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    window.location.href = `/create.html?community=${communityData.id}`;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

console.log('👥 Community page loaded');
</script>
</body>
</html>
