<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Takean - Сообщество</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ===== ВСЕ СТИЛИ (БЕЗ ИЗМЕНЕНИЙ) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1c1c1c;
            --bg-hover: #2a2a2a;
            --bg-input: #252525;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --border-color: #2c2c2c;
            --border-light: #3a3a3a;
            --accent: #4f8cff;
            --accent-hover: #6b9fff;
            --accent-light: rgba(79, 140, 255, 0.15);
            --green: #4caf50;
            --red: #f44336;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --radius: 4px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --topbar-height: 60px;
            --online-color: #4caf50;
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f0;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #e8e8e8;
            --bg-input: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --border-light: #d0d0d0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        html {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: var(--radius); }

        .container { max-width: 900px; margin: 0 auto; padding: 0 16px; width: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .flex-col { display: flex; flex-direction: column; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .gap-16 { gap: 16px; }
        .gap-24 { gap: 24px; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.4; }
            100% { transform: scale(4); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes likePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .animate-fade { animation: fadeIn 0.25s ease-out; }
        .animate-slide { animation: slideUp 0.3s ease-out; }

        /* ===== TOP BAR ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            min-height: var(--topbar-height);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .topbar-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .topbar-logo span { color: var(--accent); }

        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .topbar-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar-nav a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .topbar-nav a.active {
            color: var(--accent);
            background: var(--accent-light);
        }

        .topbar-nav a .material-icons { font-size: 20px; }
        .topbar-nav a span:not(.material-icons) { display: inline; }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .topbar-actions .material-icons {
            font-size: 22px;
            color: var(--text-secondary);
        }

        .topbar-actions .avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar-actions .avatar-small:hover {
            border-color: var(--accent);
        }

        .topbar-actions .avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .topbar-actions .avatar-small .online-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
        }

        .topbar-actions .avatar-small .online-dot.show {
            display: block;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 160px;
        }

        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            padding: 6px 6px;
            width: 100%;
            min-width: 60px;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
            font-size: 12px;
        }

        .search-bar .material-icons {
            color: var(--text-muted);
            font-size: 18px;
        }

        /* ===== RIPPLE BUTTON ===== */
        .ripple-btn {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
            background: none;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius);
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none;
        }

        .ripple-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .ripple-btn .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }

        [data-theme="light"] .ripple-btn .ripple-effect {
            background: rgba(0, 0, 0, 0.1);
        }

        .ripple-btn:hover { background: var(--bg-hover); }
        .ripple-btn:active { transform: scale(0.96); }

        .ripple-btn.primary {
            background: var(--accent);
            color: #fff;
        }
        .ripple-btn.primary:hover { background: var(--accent-hover); }

        .ripple-btn.outline {
            border: 1px solid var(--border-color);
        }
        .ripple-btn.outline:hover { background: var(--bg-hover); }

        .ripple-btn.danger {
            color: var(--red);
        }
        .ripple-btn.danger:hover { background: rgba(244, 67, 54, 0.1); }

        .ripple-btn.success {
            color: var(--green);
        }
        .ripple-btn.success:hover { background: rgba(76, 175, 80, 0.1); }

        /* ===== MODAL (ОБЩИЙ) ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease-out;
            padding: 16px;
        }

        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px 28px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease-out;
        }

        .modal-box .close-modal {
            float: right;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 24px;
            -webkit-tap-highlight-color: transparent;
        }

        .modal-box h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-box .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .modal-box .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-box .modal-header .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 24px;
            padding: 4px;
            -webkit-tap-highlight-color: transparent;
        }

        .modal-box .modal-header .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-box .field {
            margin-bottom: 16px;
        }

        .modal-box .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .modal-box .field input[type="text"],
        .modal-box .field input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal-box .field input:focus {
            border-color: var(--accent);
        }

        .modal-box .field .input-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .modal-box .field .input-error {
            font-size: 12px;
            color: var(--red);
            margin-top: 4px;
            display: none;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .modal-box .modal-actions .ripple-btn {
            padding: 8px 24px;
        }

        /* ===== COMMUNITY ===== */
        .community-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            margin: 16px 0;
        }

        .community-cover {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            position: relative;
            overflow: hidden;
        }

        .community-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .community-cover .cover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .community-cover:hover .cover-overlay {
            opacity: 1;
        }

        .community-cover .cover-overlay .material-icons {
            font-size: 40px;
            color: #fff;
        }

        .community-info {
            padding: 16px 20px 20px;
        }

        .community-name-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .community-avatar {
            width: 64px;
            height: 64px;
            border-radius: var(--radius);
            background: var(--bg-hover);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: var(--text-secondary);
            position: relative;
            cursor: pointer;
        }

        .community-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .community-avatar .avatar-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: var(--radius);
        }

        .community-avatar:hover .avatar-overlay {
            opacity: 1;
        }

        .community-avatar .avatar-overlay .material-icons {
            font-size: 24px;
            color: #fff;
        }

        .community-name {
            font-size: 22px;
            font-weight: 700;
        }

        .community-handle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .community-desc {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0 12px;
        }

        .community-stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .community-stats .stat {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .community-stats .stat .num {
            font-weight: 700;
            color: var(--text-primary);
        }

        .community-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .community-members {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .community-members .avatar-stack {
            display: flex;
            flex-wrap: wrap;
        }

        .community-members .avatar-stack .mini-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            margin-left: -8px;
            overflow: hidden;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .community-members .avatar-stack .mini-avatar:first-child { margin-left: 0; }
        .community-members .avatar-stack .mini-avatar:hover { border-color: var(--accent); }

        .community-members .avatar-stack .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .community-members .avatar-stack .mini-avatar .online-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
        }

        .community-members .avatar-stack .mini-avatar .online-dot.show {
            display: block;
        }

        .community-members .members-count {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 8px;
            cursor: pointer;
        }

        .community-members .members-count:hover {
            color: var(--accent);
        }

        /* ===== POST CARD ===== */
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease-out;
        }

        .post-card:hover {
            border-color: var(--border-light);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .post-avatar .online-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
        }

        .post-avatar .online-dot.show {
            display: block;
        }

        .post-user {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex: 1;
            min-width: 0;
        }

        .post-username {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .post-username:hover { color: var(--accent); }

        .post-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .post-title {
            font-size: 16px;
            font-weight: 700;
            margin: 6px 0 8px;
            line-height: 1.4;
            color: var(--text-primary);
            cursor: pointer;
        }

        .post-title:hover { color: var(--accent); }

        .post-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 8px;
            word-wrap: break-word;
            max-height: 120px;
            overflow: hidden;
            position: relative;
        }

        .post-content::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, var(--bg-card));
            pointer-events: none;
        }

        .post-content .mention {
            color: var(--accent);
            font-weight: 500;
            cursor: pointer;
        }

        .bbc-bold { font-weight: 700; }
        .bbc-italic { font-style: italic; }
        .bbc-underline { text-decoration: underline; }
        .bbc-strike { text-decoration: line-through; }
        .bbc-code { font-family: monospace; background: var(--bg-input); padding: 2px 6px; border-radius: var(--radius); }
        .bbc-quote { border-left: 3px solid var(--accent); padding-left: 12px; margin: 4px 0; color: var(--text-secondary); }
        .bbc-spoiler {
            background: var(--bg-hover);
            color: var(--bg-hover);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: var(--radius);
            transition: color 0.3s, background 0.3s;
            user-select: none;
        }
        .bbc-spoiler:hover { color: var(--text-primary); background: var(--bg-input); }
        .bbc-spoiler.revealed { color: var(--text-primary); background: var(--bg-input); }
        .bbc-size-small { font-size: 12px; }
        .bbc-size-normal { font-size: 15px; }
        .bbc-size-large { font-size: 20px; }
        .bbc-size-huge { font-size: 26px; }

        .post-images {
            display: grid;
            gap: 4px;
            margin: 8px 0;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .post-images .img-wrap {
            position: relative;
            background: var(--bg-hover);
            overflow: hidden;
            cursor: pointer;
        }

        .post-images .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .post-images .img-wrap .image-count {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 600;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .post-action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .post-action-btn:hover { background: var(--bg-hover); }
        .post-action-btn:active { transform: scale(0.92); }
        .post-action-btn .material-icons { font-size: 18px; transition: transform 0.2s; }
        .post-action-btn.liked .material-icons {
            color: var(--accent);

<script>
// ============================================================

const firebaseConfig = {

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const IMGBB_API_KEY = '82ba1ce293103084398ae828937d95d4';

let currentUser = null;
let communityData = null;
let communityId = null;
let communityPosts = [];

let communityAdmins = [];
let isCommunityOwner = false;

document.documentElement.setAttribute('data-theme', currentTheme);

// ============================================================
// ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ============================================================
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function generateShortId() {
    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let result = '';
    for (let i = 0; i < 8; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

// ============================================================
// ПАРСИНГ BBC
// ============================================================
function parseBBCForDisplay(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    html = html.replace(/\[b\](.*?)\[\/b\]/g, '<span class="bbc-bold">$1</span>');
    html = html.replace(/\[i\](.*?)\[\/i\]/g, '<span class="bbc-italic">$1</span>');
    html = html.replace(/\[u\](.*?)\[\/u\]/g, '<span class="bbc-underline">$1</span>');
    html = html.replace(/\[s\](.*?)\[\/s\]/g, '<span class="bbc-strike">$1</span>');
    html = html.replace(/\[code\](.*?)\[\/code\]/g, '<span class="bbc-code">$1</span>');
    html = html.replace(/\[quote\](.*?)\[\/quote\]/g, '<div class="bbc-quote">$1</div>');
    html = html.replace(/\[spoiler\](.*?)\[\/spoiler\]/g, '<span class="bbc-spoiler" onclick="event.stopPropagation();this.classList.toggle(\'revealed\')">$1</span>');
    html = html.replace(/\[size=small\](.*?)\[\/size\]/g, '<span class="bbc-size-small">$1</span>');
    html = html.replace(/\[size=normal\](.*?)\[\/size\]/g, '<span class="bbc-size-normal">$1</span>');
    html = html.replace(/\[size=large\](.*?)\[\/size\]/g, '<span class="bbc-size-large">$1</span>');
    html = html.replace(/\[size=huge\](.*?)\[\/size\]/g, '<span class="bbc-size-huge">$1</span>');
    html = html.replace(/\[color=(#[0-9a-fA-F]{6})\](.*?)\[\/color\]/g, '<span style="color:$1;">$2</span>');
    html = html.replace(/\[bg=(#[0-9a-fA-F]{6})\](.*?)\[\/bg\]/g, '<span style="background:$1;padding:2px 4px;border-radius:var(--radius);">$2</span>');
    html = html.replace(/\[url\](.*?)\[\/url\]/g, '<a href="$1" target="_blank" style="color:var(--accent);">$1</a>');
    html = html.replace(/\[url=(.*?)\](.*?)\[\/url\]/g, '<a href="$1" target="_blank" style="color:var(--accent);">$2</a>');
    html = html.replace(/\[img\](.*?)\[\/img\]/g, '<img src="$1" style="max-width:100%;max-height:300px;border-radius:var(--radius);margin:4px 0;" loading="lazy">');
    html = html.replace(/@([a-zA-Z0-9_.-]+)/g, '<span class="mention" onclick="goToProfileByUsername(\'$1\')">@$1</span>');
    html = html.replace(/\n/g, '<br>');
    return html;
}

function goToProfileByUsername(username) {
    db.collection('users').where('username', '==', username).get()
        .then(snapshot => {
            if (!snapshot.empty) {
                window.location.href = `/profile.html?uid=${snapshot.docs[0].id}`;
            }
        })
        .catch(() => {});
}

// ============================================================
// СОЗДАНИЕ ПОЛЬЗОВАТЕЛЯ В FIRESTORE
// ============================================================
function createUserInFirestore(user) {
    return db.collection('users').doc(user.uid).get().then(doc => {
        if (!doc.exists) {
            let username = user.displayName || 'user_' + Date.now().toString(36);
            username = username.toLowerCase().replace(/[^a-z0-9_.-]/g, '');
            if (!username || username.length < 2) {
                username = 'user_' + Date.now().toString(36);
            }
            return db.collection('users').doc(user.uid).set({
                username: username,
                displayName: user.displayName || username,
                email: user.email || '',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                avatar: user.photoURL || null,
                cover: null,
                bio: '',
                reputation: 0,
                followers: [],
                following: [],
                theme: currentTheme,
                isOnline: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        return doc;
    });
}

// ============================================================
// ОНЛАЙН СТАТУС
// ============================================================
let onlineCheckInterval = null;
let isUserActive = true;
let inactivityTimer = null;

function updateOnlineStatus() {
    if (!currentUser) return;
    db.collection('users').doc(currentUser.uid).update({
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        isOnline: isUserActive
    }).catch(() => {});
}

function startOnlineTracking() {
    if (onlineCheckInterval) clearInterval(onlineCheckInterval);
    
    isUserActive = true;
    updateOnlineStatus();
    
    function resetInactivity() {
        isUserActive = true;
        updateOnlineStatus();
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(() => {
            isUserActive = false;
            updateOnlineStatus();
        }, 120000);
    }
    
    const events = ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'click'];
    events.forEach(event => {
        document.addEventListener(event, resetInactivity);
    });
    
    resetInactivity();
    
    onlineCheckInterval = setInterval(() => {
        if (currentUser) {
            updateOnlineStatus();
        }
    }, 30000);
    
    window.addEventListener('beforeunload', () => {
        if (currentUser) {
            db.collection('users').doc(currentUser.uid).update({
                isOnline: false,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
        }
    });
    
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            isUserActive = false;
            if (currentUser) {
                db.collection('users').doc(currentUser.uid).update({
                    isOnline: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
            }
        } else {
            isUserActive = true;
            updateOnlineStatus();
            resetInactivity();
        }
    });
}

// ============================================================
// ЗАГРУЗКА ДАННЫХ ПОЛЬЗОВАТЕЛЯ (ИСПРАВЛЕНО)
// ============================================================
function loadUserData() {
    const user = auth.currentUser;
    currentUser = user;
    
    const avatarEl = document.getElementById('userAvatar');
    const dotEl = document.getElementById('userOnlineDot');
    
    if (user) {
        // ===== ЗАГРУЖАЕМ АВАТАРКУ ИЗ FIRESTORE =====
        db.collection('users').doc(user.uid).get()
            .then(doc => {
                let avatarUrl = user.photoURL || null;
                let displayName = user.displayName || '?';
                
                if (doc.exists) {
                    const data = doc.data();
                    avatarUrl = data.avatar || user.photoURL || null;
                    displayName = data.displayName || user.displayName || '?';
                    
                    if (data.avatar && !user.photoURL) {
                        user.updateProfile({ photoURL: data.avatar }).catch(() => {});
                    }
                }
                
                if (avatarEl) {
                    avatarEl.innerHTML = avatarUrl 
                        ? `<img src="${avatarUrl}" alt="avatar">` 
                        : `<span>${displayName[0].toUpperCase()}</span>`;
                    avatarEl.onclick = () => window.location.href = `/profile.html?uid=${user.uid}`;
                }
                if (dotEl) dotEl.classList.add('show');
            })
            .catch(() => {
                if (avatarEl) {
                    avatarEl.innerHTML = user.photoURL 
                        ? `<img src="${user.photoURL}" alt="avatar">` 
                        : `<span>${(user.displayName || '?')[0].toUpperCase()}</span>`;
                    avatarEl.onclick = () => window.location.href = `/profile.html?uid=${user.uid}`;
                }
                if (dotEl) dotEl.classList.add('show');
            });
        
        createUserInFirestore(user).then(() => {
            startOnlineTracking();
        }).catch(err => console.error('Error creating user:', err));
    } else {
        if (avatarEl) {
            avatarEl.innerHTML = '<span>?</span>';
            avatarEl.onclick = () => window.location.href = '/login.html';
        }
        if (dotEl) dotEl.classList.remove('show');
        if (onlineCheckInterval) {
            clearInterval(onlineCheckInterval);
            onlineCheckInterval = null;
        }
    }
}

auth.onAuthStateChanged(user => { loadUserData(); });

// ЗАГРУЗКА ДАННЫХ СООБЩЕСТВА
// ============================================================
function loadCommunity(id) {
    const container = document.getElementById('communityContainer');
    container.innerHTML = '<div class="loading-spinner"><span class="material-icons">refresh</span> Загрузка...</div>';

    db.collection('communities').doc(id).get()
        .then(doc => {
            if (!doc.exists) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">group_off</span>
                        <h3 style="font-weight:500;">Сообщество не найдено</h3>
                        <button class="ripple-btn primary" style="margin-top:12px;" onclick="window.location.href='/communities.html'">
                            Все сообщества
                        </button>
                    </div>
                `;
                return;
            }
            communityData = { id: doc.id, ...doc.data() };
            communityAdmins = communityData.admins || [];
            isCommunityOwner = currentUser && communityData.ownerId === currentUser.uid;
            
            // ===== ПРОВЕРЯЕМ, СОСТОИТ ЛИ ПОЛЬЗОВАТЕЛЬ В СООБЩЕСТВЕ =====
            isUserMember = currentUser && communityData.members && communityData.members.includes(currentUser.uid);
            
            document.title = `${communityData.name || 'Сообщество'} | Takean`;
            renderCommunity(communityData);
            loadCommunityPosts(id);
            loadMembersStatus(communityData.members || []);
        })
        .catch(err => {
            console.error('Load community error:', err);
            container.innerHTML = `
                <div class="error-state">
                    <span class="material-icons">error</span>
                    <h3 style="font-weight:500;">Ошибка загрузки сообщества</h3>
                    <div class="error-details">${err.message}</div>
                    <button class="ripple-btn primary" style="margin-top:12px;" onclick="loadCommunity('${id}')">
                        <span class="material-icons">refresh</span> Повторить
                    </button>
                </div>
            `;
        });
}

// ============================================================
// ЗАГРУЗКА СТАТУСА УЧАСТНИКОВ (С АВАТАРКАМИ)
// ============================================================
function loadMembersStatus(memberIds) {
    if (!memberIds || !memberIds.length) return;
    
    memberIds.forEach(uid => {
        db.collection('users').doc(uid).get()
            .then(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    userOnlineStatus[uid] = data.isOnline || false;
                    allUsersCache[uid] = {
                        id: uid,
                        username: data.username || 'anonymous',
                        displayName: data.displayName || data.username || 'Аноним',
                        avatar: data.avatar || null,
                        isOnline: data.isOnline || false
                    };
                    updateMemberUI(uid);
                }
            })
            .catch(() => {});
    });
}

// ============================================================
// ОБНОВЛЕНИЕ UI УЧАСТНИКОВ
// ============================================================
function updateMemberUI(uid) {
    const userData = allUsersCache[uid];
    if (!userData) return;
    
    const miniAvatars = document.querySelectorAll(`.mini-avatar[data-uid="${uid}"]`);
    miniAvatars.forEach(el => {
        const avatar = userData.avatar || '';
        const displayName = userData.displayName || userData.username || '?';
        if (avatar) {
            el.innerHTML = `<img src="${avatar}" alt="">`;
        } else {
            el.innerHTML = `<span>${displayName[0].toUpperCase()}</span>`;
        }
        const dot = document.createElement('span');
        dot.className = `online-dot ${userData.isOnline ? 'show' : ''}`;
        el.appendChild(dot);
    });
}

// ============================================================
// ПРОВЕРКА ПРАВ АДМИНА
// ============================================================
function isAdmin(uid) {
    if (!uid) return false;
    if (isCommunityOwner) return true;
    return communityAdmins && communityAdmins.includes(uid);
}

// ============================================================
// ОТОБРАЖЕНИЕ СООБЩЕСТВА
// ============================================================
function renderCommunity(community) {
    const container = document.getElementById('communityContainer');
    
    // ===== ОБНОВЛЯЕМ СТАТУС УЧАСТНИКА ПРИ КАЖДОМ РЕНДЕРЕ =====
    if (currentUser) {
        isUserMember = community.members && community.members.includes(currentUser.uid);
        isCommunityOwner = community.ownerId === currentUser.uid;
    }
    
    const isOwner = currentUser && community.ownerId === currentUser.uid;
    const displayMembers = community.members || [];
    const memberCount = community.memberCount || displayMembers.length;
    const canManage = isOwner || isAdmin(currentUser?.uid);
    const canPost = isUserMember || isOwner || isAdmin(currentUser?.uid);
    
    let membersStackHtml = '';
    const showMembers = displayMembers.slice(0, 5);
    showMembers.forEach((member) => {
        const userData = allUsersCache[member] || {};
        const avatar = userData.avatar || '';
        const displayName = userData.displayName || userData.username || '?';
        const isOnline = userOnlineStatus[member] || false;
        
        membersStackHtml += `
            <div class="mini-avatar" data-uid="${member}" onclick="goToProfileWithContext('${member}')" title="${escapeHtml(displayName)}">
                ${avatar ? `<img src="${avatar}" alt="">` : `<span>${displayName[0].toUpperCase()}</span>`}
                <span class="online-dot ${isOnline ? 'show' : ''}"></span>
            </div>
        `;
    });
    if (displayMembers.length > 5) {
        membersStackHtml += `<div class="mini-avatar" onclick="showMembers()">+${displayMembers.length - 5}</div>`;
    }
    
    container.innerHTML = `
        <div class="community-header">
            <div class="community-cover">
                ${community.cover ? `<img src="${community.cover}" alt="cover" id="communityCover">` : ''}
                ${isOwner ? `
                    <div class="cover-overlay" onclick="editCommunityMedia('cover')">
                        <span class="material-icons">photo_camera</span>
                    </div>
                ` : ''}
            </div>
            
            <div class="community-info">
                <div class="community-name-wrap">
                    <div class="community-avatar" ${isOwner ? `onclick="editCommunityMedia('avatar')"` : ''}>
                        ${community.avatar ? `<img src="${community.avatar}" alt="avatar" id="communityAvatar">` : `<span class="material-icons">group</span>`}
                        ${isOwner ? `
                            <div class="avatar-overlay">
                                <span class="material-icons">photo_camera</span>
                            </div>
                        ` : ''}
                    </div>
                    <div>
                        <div class="community-name">${escapeHtml(community.name)}</div>
                        <div class="community-handle">@${escapeHtml(community.handle || community.id)}</div>
                    </div>
                </div>
                
                <div class="community-desc">${escapeHtml(community.description || 'Нет описания')}</div>
                
                <div class="community-stats">
                    <span class="stat"><span class="num">${memberCount}</span> участников</span>
                    <span class="stat"><span class="num">${community.postsCount || 0}</span> тейков</span>
                    ${community.ownerName ? `<span class="stat">Создатель: <span style="color:var(--text-primary);">${escapeHtml(community.ownerName)}</span></span>` : ''}
                </div>
                
                <div class="community-members">
                    <div class="avatar-stack">
                        ${membersStackHtml}
                    </div>
                    <span class="members-count" onclick="showMembers()">
                        ${displayMembers.length} участников
                    </span>
                </div>
                
                <div class="community-actions">
                    ${!isOwner ? `
                        ${isUserMember ? `
                            <button class="ripple-btn outline" onclick="showLeaveConfirmation()">
                                Выйти
                            </button>
                        ` : `
                            <button class="ripple-btn primary" onclick="toggleJoinCommunity()">
                                Вступить
                            </button>
                        `}
                    ` : `
                        <button class="ripple-btn outline" onclick="editCommunity()">
                            <span class="material-icons">edit</span> Редактировать
                        </button>
                        <button class="ripple-btn danger" onclick="confirmDeleteCommunity()">
                            <span class="material-icons">delete</span> Удалить
                        </button>
                    `}
                    ${canPost ? `
                        <button class="ripple-btn outline" onclick="createPostInCommunity()">
                            <span class="material-icons">add</span> Создать тейк
                        </button>
                    ` : `
                        <button class="ripple-btn outline" disabled style="opacity:0.5;cursor:not-allowed;" title="Вступите в сообщество, чтобы создавать тейки">
                            <span class="material-icons">add</span> Создать тейк
                        </button>
                    `}
                    <button class="ripple-btn outline" onclick="copyCommunityLink()">
                        <span class="material-icons">link</span> Скопировать ссылку
                    </button>
                    ${canManage ? `
                        <button class="ripple-btn outline" onclick="showMembers()">
                            <span class="material-icons">manage_accounts</span> Управление
                        </button>
                    ` : ''}
                </div>
            </div>
        </div>
        
        <div id="communityPosts">
            <div class="loading-spinner"><span class="material-icons">refresh</span> Загрузка тейков...</div>
        </div>
    `;
    
    if (displayMembers.length) {
        displayMembers.forEach(uid => {
            if (userOnlineStatus[uid] !== undefined) {
                updateMemberUI(uid);
            }
        });
    }
}

// ============================================================
// МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ ВЫХОДА
// ============================================================
function showLeaveConfirmation() {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal-box">
            <div class="modal-header">
                <h2><span class="material-icons" style="color:var(--red);">logout</span> Выйти из сообщества?</h2>
                <button class="close-btn" onclick="this.closest('.modal-overlay').remove()">×</button>
            </div>
            <div style="text-align:center;margin-bottom:16px;">
                <div style="font-size:14px;color:var(--text-secondary);">
                    Вы действительно хотите покинуть сообщество <strong>${escapeHtml(communityData.name || '')}</strong>?
                </div>
                <div style="font-size:13px;color:var(--text-muted);margin-top:8px;">
                    Вы потеряете доступ к публикации тейков в этом сообществе.
                </div>
            </div>
            <div class="modal-actions">
                <button class="ripple-btn outline" onclick="this.closest('.modal-overlay').remove()">Отмена</button>
                <button class="ripple-btn danger" id="confirmLeaveBtn">
                    <span class="material-icons">logout</span> Выйти
                </button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    
    document.getElementById('confirmLeaveBtn').addEventListener('click', function() {
        const btn = this;
        btn.disabled = true;
        btn.innerHTML = '<span class="material-icons" style="animation:spin 1s linear infinite;">refresh</span>';
        
        const ref = db.collection('communities').doc(communityData.id);
        db.runTransaction(transaction => {
            return transaction.get(ref).then(doc => {
                if (!doc.exists) return;
                const data = doc.data();
                let members = data.members || [];
                members = members.filter(id => id !== currentUser.uid);
                
                transaction.update(ref, {
                    members: members,
                    memberCount: members.length
                });
            });
        }).then(() => {
            communityData.members = (communityData.members || []).filter(id => id !== currentUser.uid);
            communityData.memberCount = communityData.members.length;
            isUserMember = false;
            modal.remove();
            renderCommunity(communityData);
            alert('Вы вышли из сообщества');
            window.location.href = '/communities.html';
        }).catch(err => {
            alert('Ошибка: ' + err.message);
            btn.disabled = false;
            btn.innerHTML = '<span class="material-icons">logout</span> Выйти';
        });
    });
}

// ============================================================
// ПЕРЕХОД В ПРОФИЛЬ С КОНТЕКСТОМ СООБЩЕСТВА
// ============================================================
function goToProfileWithContext(uid) {
    if (!uid) return;
    const params = new URLSearchParams();
    params.set('uid', uid);
    if (communityId) {
        params.set('community', communityId);
        params.set('admin', isCommunityOwner || isAdmin(currentUser?.uid) ? 'true' : 'false');
        params.set('owner', isCommunityOwner ? 'true' : 'false');
    }
    window.location.href = `/profile.html?${params.toString()}`;
}

// ============================================================
// ЗАГРУЗКА ПОСТОВ СООБЩЕСТВА
// ============================================================
function loadCommunityPosts(id) {
    const container = document.getElementById('communityPosts');
    
    db.collection('posts')
        .where('communityId', '==', id)
        .orderBy('createdAt', 'desc')
        .limit(30)
        .get()
        .then(snapshot => {
            communityPosts = [];
            const promises = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                communityPosts.push({ id: doc.id, ...data });
                if (data.authorId) {
                    promises.push(
                        db.collection('users').doc(data.authorId).get().then(userDoc => {
                            if (userDoc.exists) {
                                const userData = userDoc.data();
                                data.authorName = userData.displayName || userData.username || 'Аноним';
                                data.authorAvatar = userData.avatar || null;
                            }
                        }).catch(() => {})
                    );
                }
            });
            
            Promise.all(promises).then(() => {
                renderPosts(communityPosts);
            }).catch(() => {
                renderPosts(communityPosts);
            });
        })
        .catch(err => {
            console.error('Load posts error:', err);
            container.innerHTML = `
                <div class="error-state">
                    <span class="material-icons">error</span>
                    <h3 style="font-weight:500;">Ошибка загрузки тейков</h3>
                    <div class="error-details">${err.message}</div>
                    <button class="ripple-btn primary" style="margin-top:12px;" onclick="loadCommunityPosts('${id}')">
                        <span class="material-icons">refresh</span> Повторить
                    </button>
                </div>
            `;
        });
}

// ============================================================
// ОТОБРАЖЕНИЕ ПОСТОВ
// ============================================================
function renderPosts(posts) {
    const container = document.getElementById('communityPosts');
    if (!posts || !posts.length) {
        container.innerHTML = `
            <div class="empty-state">
                <span class="material-icons">inbox</span>
                <p>В сообществе пока нет тейков</p>
                ${isUserMember ? `
                    <button class="ripple-btn primary" style="margin-top:8px;" onclick="createPostInCommunity()">
                        <span class="material-icons">add</span> Создать первый тейк
                    </button>
                ` : `
                    <p style="font-size:13px;color:var(--text-muted);margin-top:8px;">Вступите в сообщество, чтобы создавать тейки</p>
                `}
            </div>
        `;
        return;
    }

    container.innerHTML = posts.map(post => {
        const images = post.images || [];
        const imageCount = images.length;
        let gridStyle = '';
        if (imageCount === 1) gridStyle = 'grid-template-columns:1fr;';
        else if (imageCount === 2) gridStyle = 'grid-template-columns:1fr 1fr;';
        else if (imageCount === 3) gridStyle = 'grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;';
        else if (imageCount >= 4) gridStyle = 'grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;';
        
        let imagesHtml = '';
        if (imageCount > 0) {
            const showCount = Math.min(imageCount, 4);
            for (let i = 0; i < showCount; i++) {
                const extra = (i === 3 && imageCount > 4) ? `<span class="image-count">+${imageCount - 4}</span>` : '';
                imagesHtml += `
                    <div class="img-wrap" onclick="event.stopPropagation(); openImageViewer('${images[i]}')">
                        <img src="${images[i]}" alt="post image" loading="lazy">
                        ${extra}
                    </div>
                `;
            }
        }
        
        let timeText = 'недавно';
        if (post.createdAt) {
            const date = post.createdAt.toDate ? post.createdAt.toDate() : new Date(post.createdAt);
            timeText = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        
        const parsedContent = parseBBCForDisplay(post.content || '');
        const communityName = post.communityName || communityData?.name || post.community || 'Сообщество';
        
        const isLiked = post.likes && currentUser && post.likes.includes(currentUser.uid);
        const isDisliked = post.dislikes && currentUser && post.dislikes.includes(currentUser.uid);
        
        return `
            <div class="post-card" onclick="window.location.href='/post.html?id=${post.id}'" style="cursor:pointer;">
                <div class="post-header">
                    <div class="post-avatar" onclick="event.stopPropagation(); goToProfileWithContext('${post.authorId}')">
                        ${post.authorAvatar ? `<img src="${post.authorAvatar}" alt="">` : `<span>${(post.authorName || '?')[0].toUpperCase()}</span>`}
                    </div>
                    <div class="post-user">
                        <div class="post-username" onclick="event.stopPropagation(); goToProfileWithContext('${post.authorId}')">
                            ${post.authorName || 'Аноним'}
                        </div>
                        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;">
                            <span class="post-time">${timeText}</span>
                            ${post.communityId ? `
                                <span style="color:var(--text-muted);font-size:11px;">→</span>
                                <span style="font-size:11px;color:var(--text-secondary);">${escapeHtml(communityName)}</span>
                            ` : ''}
                        </div>
                    </div>
                </div>
                <div class="post-title">${escapeHtml(post.title || 'Без заголовка')}</div>
                <div class="post-content">${parsedContent}</div>
                ${imagesHtml ? `<div class="post-images" style="${gridStyle}">${imagesHtml}</div>` : ''}
                <div class="post-actions">
                    <button class="post-action-btn ${isLiked ? 'liked' : ''}" onclick="event.stopPropagation(); toggleLike('${post.id}')" id="likeBtn_${post.id}">
                        <span class="material-icons">${isLiked ? 'thumb_up' : 'thumb_up_off_alt'}</span>
                        <span id="likeCount_${post.id}">${(post.likes || []).length}</span>
                    </button>
                    <button class="post-action-btn ${isDisliked ? 'disliked' : ''}" onclick="event.stopPropagation(); toggleDislike('${post.id}')" id="dislikeBtn_${post.id}">
                        <span class="material-icons">${isDisliked ? 'thumb_down' : 'thumb_down_off_alt'}</span>
                        <span id="dislikeCount_${post.id}">${(post.dislikes || []).length}</span>
                    </button>
                    <span class="post-action-btn"><span class="material-icons">comment</span> ${post.commentsCount || 0}</span>
                    <button class="post-action-btn" onclick="event.stopPropagation(); sharePost('${post.id}')">
                        <span class="material-icons">share</span>
                    </button>
                </div>
            </div>
        `;
    }).join('');
}

// ============================================================
// ОТКРЫТИЕ ИЗОБРАЖЕНИЯ
// ============================================================
function openImageViewer(url) {
    const overlay = document.createElement('div');
    overlay.className = 'image-viewer-overlay';
    overlay.innerHTML = `
        <button class="close-viewer" onclick="this.parentElement.remove()">×</button>
        <img src="${url}" alt="Просмотр изображения">
    `;
    overlay.onclick = (e) => {
        if (e.target === overlay) overlay.remove();
    };
    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';
}

// ============================================================

function toggleLike(postId) {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    
    const postRef = db.collection('posts').doc(postId);
    const btn = document.getElementById(`likeBtn_${postId}`);
    const countEl = document.getElementById(`likeCount_${postId}`);
    if (!btn || !countEl) return;
    
    const isLiked = btn.classList.contains('liked');
    
    if (isLiked) {
        btn.classList.remove('liked');
        btn.querySelector('.material-icons').textContent = 'thumb_up_off_alt';
        countEl.textContent = parseInt(countEl.textContent) - 1;
    } else {
        btn.classList.add('liked');
        btn.querySelector('.material-icons').textContent = 'thumb_up';
        countEl.textContent = parseInt(countEl.textContent) + 1;
        const dislikeBtn = document.getElementById(`dislikeBtn_${postId}`);
        if (dislikeBtn && dislikeBtn.classList.contains('disliked')) {
            dislikeBtn.classList.remove('disliked');
            dislikeBtn.querySelector('.material-icons').textContent = 'thumb_down_off_alt';
            const dislikeCount = document.getElementById(`dislikeCount_${postId}`);
            if (dislikeCount) dislikeCount.textContent = parseInt(dislikeCount.textContent) - 1;
        }
    }
    
    db.runTransaction(transaction => {
        return transaction.get(postRef).then(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            let likes = data.likes || [];
            let dislikes = data.dislikes || [];
            
            if (isLiked) {
                likes = likes.filter(id => id !== currentUser.uid);
            } else {
                likes.push(currentUser.uid);
                dislikes = dislikes.filter(id => id !== currentUser.uid);
            }
            
            transaction.update(postRef, { likes, dislikes });
        });
    }).catch(err => {
        console.error('Like error:', err);
        if (isLiked) {
            btn.classList.add('liked');
            btn.querySelector('.material-icons').textContent = 'thumb_up';
            countEl.textContent = parseInt(countEl.textContent) + 1;
        } else {
            btn.classList.remove('liked');
            btn.querySelector('.material-icons').textContent = 'thumb_up_off_alt';
            countEl.textContent = parseInt(countEl.textContent) - 1;
        }
    });
}

// ВСТУПЛЕНИЕ / ВЫХОД ИЗ СООБЩЕСТВА (С ПРОВЕРКОЙ)
// ============================================================
function toggleJoinCommunity() {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    if (!communityData) return;

    // ===== ПРОВЕРКА: ЕСЛИ УЖЕ УЧАСТНИК — НЕ ДОБАВЛЯЕМ =====
    if (communityData.members && communityData.members.includes(currentUser.uid)) {
        isUserMember = true;
        renderCommunity(communityData);
        return;
    }

    const ref = db.collection('communities').doc(communityData.id);

    db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            let members = data.members || [];
            
            // ===== ПРОВЕРКА ПЕРЕД ДОБАВЛЕНИЕМ =====
            if (members.includes(currentUser.uid)) {
                return;
            }
            
            members.push(currentUser.uid);
            
            transaction.update(ref, {
                members: members,
                memberCount: members.length
            });
        });
    }).then(() => {
        communityData.members = [...(communityData.members || []), currentUser.uid];
        communityData.memberCount = communityData.members.length;
        isUserMember = true;
        renderCommunity(communityData);
        loadMembersStatus(communityData.members || []);
        
        // ===== ПЕРЕНОПРАВЛЯЕМ НА СТРАНИЦУ СООБЩЕСТВА (ОБНОВЛЁННУЮ) =====
        window.location.href = `/community.html?id=${communityData.id}`;
    }).catch(err => {
        alert('Ошибка: ' + err.message);
    });
}

// ============================================================
// ПОКАЗ УЧАСТНИКОВ С УПРАВЛЕНИЕМ (С АВАТАРКАМИ)
// ============================================================
function showMembers() {
    if (!communityData || !communityData.members || !communityData.members.length) {
        alert('Нет участников');
        return;
    }

    const canManage = isCommunityOwner || isAdmin(currentUser?.uid);

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal-box">
            <button class="close-modal" onclick="this.closest('.modal-overlay').remove()">×</button>
            <h3>Участники сообщества ${canManage ? '(управление)' : ''}</h3>
            <div id="membersList">
                <div class="loading-spinner"><span class="material-icons">refresh</span></div>
            </div>
        </div>
    `;
    document.body.appendChild(modal);

    const list = modal.querySelector('#membersList');
    Promise.all(communityData.members.map(id => 
        db.collection('users').doc(id).get().then(doc => ({ id, data: doc.exists ? doc.data() : null }))
    )).then(results => {
        const sorted = results.filter(r => r.data).sort((a, b) => {
            if (a.id === communityData.ownerId) return -1;
            if (b.id === communityData.ownerId) return 1;
            const aIsAdmin = communityAdmins.includes(a.id);
            const bIsAdmin = communityAdmins.includes(b.id);
            if (aIsAdmin && !bIsAdmin) return -1;
            if (!aIsAdmin && bIsAdmin) return 1;
            return 0;
        });
        
        list.innerHTML = sorted.map(r => {
            const isOnline = r.data.isOnline || false;
            const isOwner = r.id === communityData.ownerId;
            const isAdmin = communityAdmins.includes(r.id);
            const isSelf = currentUser && r.id === currentUser.uid;
            const showControls = canManage && !isOwner && !isSelf;
            const avatar = r.data.avatar || '';
            const displayName = r.data.displayName || r.data.username || 'Аноним';
            const username = r.data.username || 'anonymous';
            
            return `
                <div class="modal-user-item">
                    <div class="avatar" onclick="goToProfileWithContext('${r.id}')">
                        ${avatar ? `<img src="${avatar}" alt="">` : `<span>${displayName[0].toUpperCase()}</span>`}
                        <span class="online-dot ${isOnline ? 'show' : ''}"></span>
                    </div>
                    <div class="info" onclick="goToProfileWithContext('${r.id}')">
                        <div class="name">
                            ${escapeHtml(displayName)}
                            ${isOwner ? '<span class="admin-badge">Создатель</span>' : ''}
                            ${isAdmin && !isOwner ? '<span class="admin-badge">Админ</span>' : ''}
                        </div>
                        <div class="username">@${escapeHtml(username)}</div>
                    </div>
                    ${showControls ? `
                        <div class="member-actions">
                            ${!isAdmin ? `
                                <button class="admin-btn" onclick="event.stopPropagation(); makeAdmin('${r.id}')" title="Сделать администратором">
                                    <span class="material-icons" style="font-size:18px;">admin_panel_settings</span>
                                </button>
                            ` : `
                                <button class="admin-btn" onclick="event.stopPropagation(); removeAdmin('${r.id}')" title="Снять с администратора">
                                    <span class="material-icons" style="font-size:18px;">remove_moderator</span>
                                </button>
                            `}
                            <button class="remove-btn" onclick="event.stopPropagation(); removeMember('${r.id}')" title="Удалить из сообщества">
                                <span class="material-icons" style="font-size:18px;">person_remove</span>
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    });
}

// ============================================================
// УПРАВЛЕНИЕ УЧАСТНИКАМИ
// ============================================================
function makeAdmin(uid) {
    if (!currentUser) return;
    if (!isCommunityOwner && !isAdmin(currentUser.uid)) {
        alert('Недостаточно прав');
        return;
    }
    if (uid === communityData.ownerId) {
        alert('Владелец сообщества всегда администратор');
        return;
    }
    if (communityAdmins.includes(uid)) {
        alert('Уже администратор');
        return;
    }
    
    const ref = db.collection('communities').doc(communityData.id);
    db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
            const admins = doc.data().admins || [];
            if (!admins.includes(uid)) {
                admins.push(uid);
                transaction.update(ref, { admins: admins });
            }
        });
    }).then(() => {
        if (!communityAdmins.includes(uid)) communityAdmins.push(uid);
        alert('Пользователь назначен администратором');
        showMembers();
    }).catch(err => alert('Ошибка: ' + err.message));
}

function removeAdmin(uid) {
    if (!currentUser) return;
    if (!isCommunityOwner && !isAdmin(currentUser.uid)) {
        alert('Недостаточно прав');
        return;
    }
    if (uid === communityData.ownerId) {
        alert('Нельзя снять с администратора владельца');
        return;
    }
    if (!communityAdmins.includes(uid)) {
        alert('Не администратор');
        return;
    }
    
    const ref = db.collection('communities').doc(communityData.id);
    db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
            let admins = doc.data().admins || [];
            admins = admins.filter(id => id !== uid);
            transaction.update(ref, { admins: admins });
        });
    }).then(() => {
        communityAdmins = communityAdmins.filter(id => id !== uid);
        alert('Администратор снят');
        showMembers();
    }).catch(err => alert('Ошибка: ' + err.message));
}

function removeMember(uid) {
    if (!currentUser) return;
    if (!isCommunityOwner && !isAdmin(currentUser.uid)) {
        alert('Недостаточно прав');
        return;
    }
    if (uid === communityData.ownerId) {
        alert('Нельзя удалить владельца сообщества');
        return;
    }
    if (!communityData.members || !communityData.members.includes(uid)) {
        alert('Пользователь не в сообществе');
        return;
    }
    if (!confirm('Удалить этого пользователя из сообщества?')) return;
    
    const ref = db.collection('communities').doc(communityData.id);
    db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
            let members = doc.data().members || [];
            members = members.filter(id => id !== uid);
            let admins = doc.data().admins || [];
            admins = admins.filter(id => id !== uid);
            transaction.update(ref, {
                members: members,
                admins: admins,
                memberCount: members.length
            });
        });
    }).then(() => {
        communityData.members = (communityData.members || []).filter(id => id !== uid);
        communityData.memberCount = communityData.members.length;
        communityAdmins = communityAdmins.filter(id => id !== uid);
        renderCommunity(communityData);
        alert('Пользователь удалён из сообщества');
        showMembers();
    }).catch(err => alert('Ошибка: ' + err.message));
}

function confirmDeleteCommunity() {
    if (!currentUser || communityData.ownerId !== currentUser.uid) return;
    
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal-box">
            <div class="modal-header">
                <h2><span class="material-icons" style="color:var(--red);">delete_forever</span> Удалить сообщество?</h2>
                <button class="close-btn" onclick="this.closest('.modal-overlay').remove()">×</button>
            </div>
            
            <div style="text-align:center;margin-bottom:16px;">
                <div style="font-size:14px;color:var(--red);margin-bottom:8px;">
                    <span class="material-icons" style="font-size:48px;display:block;margin:0 auto 8px;">warning</span>
                    Это действие <strong>необратимо</strong>
                </div>
                <div style="font-size:13px;color:var(--text-secondary);">
                    Все тейки и данные сообщества будут удалены.
                    <br>Вы уверены, что хотите продолжить?
                </div>
            </div>
            
            <div class="field">
                <label>Введите пароль для подтверждения</label>
                <input type="password" id="deletePasswordInput" placeholder="Введите ваш пароль">
                <div class="input-error" id="deletePasswordError">Неверный пароль</div>
                <div class="input-hint">Для подтверждения удаления введите текущий пароль</div>
            </div>
            
            <div class="modal-actions">
                <button class="ripple-btn outline" onclick="this.closest('.modal-overlay').remove()">Отмена</button>
                <button class="ripple-btn danger" id="confirmDeleteBtn">
                    <span class="material-icons">delete</span> Да, удалить
                </button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    
    document.getElementById('confirmDeleteBtn').addEventListener('click', function() {
        const password = document.getElementById('deletePasswordInput').value;
        const errorEl = document.getElementById('deletePasswordError');
        
        if (!password) {
            errorEl.textContent = 'Введите пароль';
            errorEl.style.display = 'block';
            return;
        }
        
        this.disabled = true;
        this.innerHTML = '<span class="material-icons" style="animation:spin 1s linear infinite;">refresh</span> Проверка...';
        errorEl.style.display = 'none';
        
        const credential = firebase.auth.EmailAuthProvider.credential(
            currentUser.email,
            password
        );
        
        currentUser.reauthenticateWithCredential(credential)
            .then(() => {
                this.innerHTML = '<span class="material-icons" style="animation:spin 1s linear infinite;">refresh</span> Удаление...';
                return db.collection('communities').doc(communityData.id).delete();
            })
            .then(() => {
                alert('Сообщество удалено');
                window.location.href = '/communities.html';
            })
            .catch(err => {
                if (err.code === 'auth/wrong-password') {
                    errorEl.textContent = 'Неверный пароль. Попробуйте снова.';
                    errorEl.style.display = 'block';
                } else {
                    alert('Ошибка: ' + err.message);
                }
                this.disabled = false;
                this.innerHTML = '<span class="material-icons">delete</span> Да, удалить';
            });
    });
    
    document.getElementById('deletePasswordInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('confirmDeleteBtn').click();
        }
    });
}
