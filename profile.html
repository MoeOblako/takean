<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta property="og:title" id="ogTitleMeta" content="Takean - Профиль">
    <meta property="og:description" id="ogDescriptionMeta" content="Профиль пользователя на Takean">
    <meta property="og:image" id="ogImageMeta" content="">
    <meta property="og:url" id="ogUrlMeta" content="">
    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="Takean">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitterTitle" content="Takean - Профиль">
    <meta name="twitter:description" id="twitterDescription" content="Профиль пользователя на Takean">
    <meta name="twitter:image" id="twitterImage" content="">
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1c1c1c;
            --bg-hover: #2a2a2a;
            --bg-input: #252525;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --border-color: #2c2c2c;
            --border-light: #3a3a3a;
            --accent: #4f8cff;
            --accent-hover: #6b9fff;
            --accent-light: rgba(79, 140, 255, 0.15);
            --green: #4caf50;
            --red: #f44336;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --radius: 4px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --topbar-height: 60px;
            --online-color: #4caf50;
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f0;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #e8e8e8;
            --bg-input: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --border-light: #d0d0d0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        html {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: var(--radius); }

        .container { max-width: 900px; margin: 0 auto; padding: 0 16px; width: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .flex-col { display: flex; flex-direction: column; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .gap-16 { gap: 16px; }
        .gap-24 { gap: 24px; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.4; }
            100% { transform: scale(4); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes likePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .animate-fade { animation: fadeIn 0.25s ease-out; }
        .animate-slide { animation: slideUp 0.3s ease-out; }

        /* ===== TOP BAR ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            min-height: var(--topbar-height);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .topbar-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .topbar-logo span { color: var(--accent); }

        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .topbar-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar-nav a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .topbar-nav a.active {
            color: var(--accent);
            background: var(--accent-light);
        }

        .topbar-nav a .material-icons { font-size: 20px; }
        .topbar-nav a span:not(.material-icons) { display: inline; }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .topbar-actions .material-icons {
            font-size: 22px;
            color: var(--text-secondary);
        }

        .topbar-actions .avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .topbar-actions .avatar-small:hover {
            border-color: var(--accent);
        }

        .topbar-actions .avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .topbar-actions .avatar-small .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
            z-index: 2;
        }

        .topbar-actions .avatar-small .online-dot.show {
            display: block;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 160px;
        }

        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            padding: 6px 6px;
            width: 100%;
            min-width: 60px;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
            font-size: 12px;
        }

        .search-bar .material-icons {
            color: var(--text-muted);
            font-size: 18px;
        }

        /* ===== RIPPLE BUTTON ===== */
        .ripple-btn {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
            background: none;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius);
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .ripple-btn .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            animation: ripple 0.5s ease-out;
            pointer-events: none;
        }

        [data-theme="light"] .ripple-btn .ripple-effect {
            background: rgba(0, 0, 0, 0.1);
        }

        .ripple-btn:hover { background: var(--bg-hover); }
        .ripple-btn:active { transform: scale(0.96); }

        .ripple-btn.primary {
            background: var(--accent);
            color: #fff;
        }
        .ripple-btn.primary:hover { background: var(--accent-hover); }

        .ripple-btn.outline {
            border: 1px solid var(--border-color);
        }
        .ripple-btn.outline:hover { background: var(--bg-hover); }

        .ripple-btn.danger {
            color: var(--red);
        }
        .ripple-btn.danger:hover { background: rgba(244, 67, 54, 0.1); }

        .ripple-btn.success {
            color: var(--green);
        }
        .ripple-btn.success:hover { background: rgba(76, 175, 80, 0.1); }

        /* ===== PROFILE ===== */
        .profile-header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            margin: 16px 0;
        }

        .profile-cover {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, var(--bg-hover), var(--border-color));
            position: relative;
            overflow: hidden;
        }

        .profile-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-cover .cover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .profile-cover:hover .cover-overlay {
            opacity: 1;
        }

        .profile-cover .cover-overlay .material-icons {
            font-size: 40px;
            color: #fff;
        }

        .profile-info {
            padding: 16px 20px 20px;
            position: relative;
        }

        .profile-avatar-wrap {
            margin-top: -60px;
            margin-bottom: 12px;
            position: relative;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--bg-hover);
            border: 4px solid var(--bg-card);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            position: relative;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar .avatar-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            border-radius: 50%;
        }

        .profile-avatar:hover .avatar-overlay {
            opacity: 1;
        }

        .profile-avatar .avatar-overlay .material-icons {
            font-size: 28px;
            color: #fff;
        }

        .profile-avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
            z-index: 2;
        }

        .profile-avatar .online-dot.show {
            display: block;
        }

        .profile-display-name {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .profile-display-name .badge {
            font-size: 11px;
            background: var(--accent-light);
            color: var(--accent);
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 500;
        }

        .profile-username {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 2px;
        }

        .profile-bio {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0 12px;
            word-wrap: break-word;
        }

        .profile-stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: 4px;
        }

        .profile-stats .stat {
            cursor: pointer;
            transition: color 0.2s;
        }

        .profile-stats .stat:hover {
            color: var(--accent);
        }

        .profile-stats .stat .num {
            font-size: 18px;
            font-weight: 700;
            display: block;
        }

        .profile-stats .stat .label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .profile-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        /* ===== COMMUNITY-ACTIONS (для админов) ===== */
        .profile-actions .community-action-divider {
            width: 100%;
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        .profile-actions .community-action-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            margin-bottom: 2px;
        }

        .profile-tabs {
            display: flex;
            gap: 2px;
            border-bottom: 1px solid var(--border-color);
            margin: 0 16px 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .profile-tabs button {
            padding: 10px 16px;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .profile-tabs button:hover {
            color: var(--text-primary);
        }

        .profile-tabs button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .profile-posts {
            padding: 0 4px 16px;
        }

        /* ===== POST CARD ===== */
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease-out;
        }

        .post-card:hover {
            border-color: var(--border-light);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
        }

        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-user {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex: 1;
            min-width: 0;
        }

        .post-username {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .post-username:hover { color: var(--accent); }

        .post-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .post-title {
            font-size: 16px;
            font-weight: 700;
            margin: 6px 0 8px;
            line-height: 1.4;
            color: var(--text-primary);
            cursor: pointer;
        }

        .post-title:hover { color: var(--accent); }

        .post-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 8px;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 4px;
            margin: 8px 0;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .post-images .img-wrap {
            position: relative;
            padding-bottom: 100%;
            background: var(--bg-hover);
            overflow: hidden;
            cursor: pointer;
        }

        .post-images .img-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .post-action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .post-action-btn:hover { background: var(--bg-hover); }
        .post-action-btn .material-icons { font-size: 18px; }

        /* ===== COMMENT CARD ===== */
        .comment-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .comment-card:hover {
            border-color: var(--border-light);
        }

        .comment-card .comment-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .comment-card .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
        }

        .comment-card .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-card .comment-username {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .comment-card .comment-username:hover { color: var(--accent); }

        .comment-card .comment-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: auto;
        }

        .comment-card .comment-text {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-secondary);
            margin: 4px 0 0 42px;
            word-wrap: break-word;
        }

        .comment-card .comment-text .mention {
            color: var(--accent);
            font-weight: 500;
            cursor: pointer;
        }

        .comment-card .comment-on {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 42px;
            margin-top: 4px;
        }

        .comment-card .comment-on a {
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
        }

        .comment-card .comment-on a:hover {
            text-decoration: underline;
        }

        .comment-card .comment-image {
            max-width: 150px;
            max-height: 150px;
            border-radius: var(--radius);
            margin-top: 4px;
            cursor: pointer;
        }

        .comment-card .comment-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 42px;
            margin-top: 4px;
        }

        .comment-card .comment-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            font-family: var(--font);
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            border-radius: var(--radius);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .comment-card .comment-actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .comment-card .comment-actions .comment-score {
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }

        .comment-card .comment-actions .comment-score.positive { color: var(--green); }
        .comment-card .comment-actions .comment-score.negative { color: var(--red); }

        .comment-card .comment-actions button.liked { color: var(--green); }
        .comment-card .comment-actions button.disliked { color: var(--red); }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease-out;
            padding: 16px;
        }

        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 28px 32px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease-out;
        }

        .modal-box .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

<script>
const firebaseConfig = {

};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const IMGBB_API_KEY = '82ba1ce293103084398ae828937d95d4';

let currentUser = null;
let profileUser = null;
let profileUserId = null;
let userPosts = [];
let userComments = [];
let onlineCheckInterval = null;
let lastActivityTime = Date.now();
let isUserOnline = false;

// Данные для интеграции с сообществом
let communityContext = null; // { communityId, isAdmin, isOwner }

let currentTheme = localStorage.getItem('takean-theme') || 'dark';
document.documentElement.setAttribute('data-theme', currentTheme);

// ============================================================
// ПОЛУЧАЕМ ПАРАМЕТРЫ ИЗ URL (community, admin)
// ============================================================
function getUrlParams() {
    const urlParams = new URLSearchParams(window.location.search);
    const communityId = urlParams.get('community') || urlParams.get('from');
    const isAdmin = urlParams.get('admin') === 'true';
    const isOwner = urlParams.get('owner') === 'true';
    return { communityId, isAdmin, isOwner };
}

// ============================================================
// ОНЛАЙН СТАТУС
// ============================================================
function updateLastActivity() {
    lastActivityTime = Date.now();
    if (!isUserOnline && currentUser) {
        isUserOnline = true;
        updateOnlineStatus(true);
    }
}

function updateOnlineStatus(status) {
    if (!currentUser) return;
    db.collection('users').doc(currentUser.uid).update({
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        isOnline: status
    }).catch(() => {});
}

function checkOnlineStatus() {
    if (!currentUser) return;
    const now = Date.now();
    const inactiveTime = (now - lastActivityTime) / 1000;
    if (inactiveTime > 120 && isUserOnline) {
        isUserOnline = false;
        updateOnlineStatus(false);
    }
}

function startOnlineTracking() {
    if (onlineCheckInterval) clearInterval(onlineCheckInterval);
    lastActivityTime = Date.now();
    isUserOnline = true;
    updateOnlineStatus(true);
    onlineCheckInterval = setInterval(checkOnlineStatus, 30000);
    const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'click', 'input', 'focus'];
    events.forEach(event => {
        document.addEventListener(event, updateLastActivity);
    });
    window.addEventListener('beforeunload', () => {
        if (currentUser) {
            db.collection('users').doc(currentUser.uid).update({
                isOnline: false,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
        }
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (currentUser) {
                isUserOnline = false;
                db.collection('users').doc(currentUser.uid).update({
                    isOnline: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
            }
        } else {
            lastActivityTime = Date.now();
            isUserOnline = true;
            updateOnlineStatus(true);
        }
    });
}

function checkUserOnline(uid) {
    return db.collection('users').doc(uid).get()
        .then(doc => {
            if (doc.exists) {
                const data = doc.data();
                if (data.isOnline === true) return true;
                if (data.lastSeen) {
                    const lastSeen = data.lastSeen.seconds * 1000;
                    const now = Date.now();
                    return (now - lastSeen) < 120000;
                }
            }
            return false;
        })
        .catch(() => false);
}

// ============================================================
// СОЗДАНИЕ ПОЛЬЗОВАТЕЛЯ
// ============================================================
function createUserInFirestore(user) {
    return db.collection('users').doc(user.uid).get().then(doc => {
        if (!doc.exists) {
            let username = user.displayName || 'user_' + Date.now().toString(36);
            username = username.toLowerCase().replace(/[^a-z0-9_.-]/g, '');
            if (!username || username.length < 2) {
                username = 'user_' + Date.now().toString(36);
            }
            return db.collection('users').doc(user.uid).set({
                username: username,
                displayName: user.displayName || username,
                email: user.email || '',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                avatar: user.photoURL || null,
                cover: null,
                bio: '',
                reputation: 0,
                followers: [],
                following: [],
                theme: currentTheme,
                isOnline: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        return doc;
    });
}

// ============================================================
// РАСЧЁТ РЕПУТАЦИИ
// ============================================================
function calculateReputation(uid) {
    let totalRep = 0;
    let likesCount = 0;
    let dislikesCount = 0;
    let commentLikes = 0;
    let commentDislikes = 0;
    
    return db.collection('posts').where('authorId', '==', uid).get()
        .then(snapshot => {
            snapshot.forEach(doc => {
                const data = doc.data();
                const likes = data.likes || [];
                const dislikes = data.dislikes || [];
                likesCount += likes.length;
                dislikesCount += dislikes.length;
                totalRep += (likes.length - dislikes.length);
            });
            return db.collection('comments').where('authorId', '==', uid).get();
        })
        .then(snapshot => {
            snapshot.forEach(doc => {
                const data = doc.data();
                const likes = data.likes || [];
                const dislikes = data.dislikes || [];
                commentLikes += likes.length;
                commentDislikes += dislikes.length;
                totalRep += (likes.length - dislikes.length);
            });
            return {
                total: totalRep,
                postLikes: likesCount,
                postDislikes: dislikesCount,
                commentLikes: commentLikes,
                commentDislikes: commentDislikes
            };
        })
        .catch(err => {
            console.error('Reputation calculation error:', err);
            return { total: totalRep, postLikes: 0, postDislikes: 0, commentLikes: 0, commentDislikes: 0 };
        });
}

// ============================================================
// ОБНОВЛЕНИЕ OG ТЕГОВ
// ============================================================
function updateOGTags(data) {
    const metaMap = {
        'og:title': data.title,
        'og:description': data.description,
        'og:image': data.image || 'https://takean.pages.dev/og-image.png',
        'og:url': data.url || window.location.href,
        'twitter:title': data.title,
        'twitter:description': data.description,
        'twitter:image': data.image || 'https://takean.pages.dev/og-image.png'
    };
    for (const [property, content] of Object.entries(metaMap)) {
        let meta = document.querySelector(`meta[property="${property}"]`);
        if (!meta) {
            meta = document.querySelector(`meta[name="${property}"]`);
        }
        if (meta) {
            meta.setAttribute('content', content);
        }
    }
}

function loadProfile(uid) {
    const container = document.getElementById('profileContainer');
    container.innerHTML = '<div class="loading-spinner"><span class="material-icons">refresh</span> Загрузка...</div>';

    db.collection('users').doc(uid).get()
        .then(doc => {
            if (!doc.exists) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">person_off</span>
                        <h3 style="font-weight:500;">Пользователь не найден</h3>
                        <p style="font-size:14px;">Возможно, аккаунт был удалён</p>
                        <button class="ripple-btn primary" style="margin-top:12px;" onclick="window.location.href='/'">
                            На главную
                        </button>
                    </div>
                `;
                return;
            }
            profileUser = { id: doc.id, ...doc.data() };
            
            checkUserOnline(uid).then(isOnline => {
                profileUser._isOnline = isOnline;
            });
            
            calculateReputation(uid).then(repData => {
                profileUser.reputation = repData.total;
                profileUser._repDetails = repData;
                db.collection('users').doc(uid).update({ reputation: repData.total }).catch(() => {});
                
                const displayName = profileUser.displayName || profileUser.username || 'Пользователь';
                const bio = profileUser.bio || 'Профиль пользователя на Takean';
                const avatar = profileUser.avatar || '';
                const url = window.location.href;
                
                document.title = `${displayName} | Takean`;
                
                updateOGTags({
                    title: displayName,
                    description: bio.substring(0, 160),
                    image: avatar,
                    url: url
                });
                
                renderProfile(profileUser);
                loadUserPosts(uid);
            });
        })
        .catch(err => {
            console.error('Profile load error:', err);
            container.innerHTML = `
                <div class="error-state">
                    <span class="material-icons">error</span>
                    <h3 style="font-weight:500;">Ошибка загрузки профиля</h3>
                    <div class="error-details">${err.message}</div>
                    <button class="ripple-btn primary" style="margin-top:12px;" onclick="location.reload()">
                        <span class="material-icons">refresh</span> Обновить
                    </button>
                </div>
            `;
        });
}

        .then(doc => {

            let buttons = '';

                buttons += `

            }
            
            if (!isTargetOwner && !isTargetAdmin && isOwner) {
                buttons += `
                    <button class="ripple-btn success" onclick="makeAdminFromProfile('${profileUser.id}')" style="width:100%;justify-content:center;">
                        <span class="material-icons">admin_panel_settings</span> Сделать администратором
                    </button>
                `;
            } else if (!isTargetOwner && isTargetAdmin && isOwner) {
                buttons += `

                        <span class="material-icons">remove_moderator</span> Снять с администратора

function removeFromCommunity(uid) {
    if (!communityContext || !communityContext.communityId) return;
    if (!confirm('Удалить этого пользователя из сообщества?')) return;
    
    const ref = db.collection('communities').doc(communityContext.communityId);
    db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
            let members = doc.data().members || [];
            let admins = doc.data().admins || [];
            members = members.filter(id => id !== uid);
            admins = admins.filter(id => id !== uid);
            transaction.update(ref, {
                members: members,
                admins: admins,
                memberCount: members.length
            });
        });
    }).then(() => {
        alert('Пользователь удалён из сообщества');
        document.querySelector('.modal-overlay')?.remove();
    }).catch(err => alert('Ошибка: ' + err.message));
}

function makeAdminFromProfile(uid) {
    if (!communityContext || !communityContext.communityId) return;
    const ref = db.collection('communities').doc(communityContext.communityId);
    
    db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
            let admins = doc.data().admins || [];
            if (!admins.includes(uid)) {
                admins.push(uid);
                transaction.update(ref, { admins: admins });
            }
        });
    }).then(() => {
        alert('Пользователь назначен администратором');
        document.querySelector('.modal-overlay')?.remove();
        // Обновляем контекст
        communityContext.isAdmin = true;
    }).catch(err => alert('Ошибка: ' + err.message));
}

function removeAdminFromProfile(uid) {
    if (!communityContext || !communityContext.communityId) return;
    const ref = db.collection('communities').doc(communityContext.communityId);
    
    db.runTransaction(transaction => {
        return transaction.get(ref).then(doc => {
            let admins = doc.data().admins || [];
            admins = admins.filter(id => id !== uid);
            transaction.update(ref, { admins: admins });
        });
    }).then(() => {
        alert('Администратор снят');
        document.querySelector('.modal-overlay')?.remove();
        communityContext.isAdmin = false;
    }).catch(err => alert('Ошибка: ' + err.message));
}

                        <div class="img-wrap"><img src="${img}" alt=""></div>
                    `).join('')}
                </div>
            ` : ''}
            <div class="post-actions">
                <span class="post-action-btn"><span class="material-icons">thumb_up</span> ${post.likes?.length || 0}</span>
                <span class="post-action-btn"><span class="material-icons">comment</span> ${post.commentsCount || 0}</span>
            </div>
        </div>
    `).join('');
}

// ============================================================
// LOAD USER COMMENTS
// ============================================================
function loadUserComments(uid) {
    const container = document.getElementById('profilePosts');
    container.innerHTML = '<div class="loading-spinner"><span class="material-icons">refresh</span> Загрузка...</div>';

    db.collection('comments')
        .where('authorId', '==', uid)
        .orderBy('createdAt', 'desc')
        .limit(30)
        .get()
        .then(snapshot => {
            userComments = [];
            snapshot.forEach(doc => {
                userComments.push({ id: doc.id, ...doc.data() });
            });
            renderComments(userComments);
        })
        .catch(err => {
            console.error('Load comments error:', err);
            container.innerHTML = `
                <div class="error-state">
                    <span class="material-icons">error</span>
                    <h3 style="font-weight:500;">Ошибка загрузки комментариев</h3>
                    <div class="error-details">${err.message}</div>
                    <button class="ripple-btn primary" style="margin-top:12px;" onclick="loadUserComments('${uid}')">
                        <span class="material-icons">refresh</span> Повторить
                    </button>
                </div>
            `;
        });
}

function renderComments(comments) {
    const container = document.getElementById('profilePosts');
    if (!comments || !comments.length) {
        container.innerHTML = `
            <div class="empty-state">
                <span class="material-icons">chat</span>
                <p>Нет комментариев</p>
            </div>
        `;
        return;
    }

    container.innerHTML = comments.map(comment => `
        <div class="comment-card">
            <div class="comment-header">
                <div class="comment-avatar" onclick="window.location.href='/profile.html?uid=${comment.authorId}'">
                    ${comment.authorAvatar ? `<img src="${comment.authorAvatar}" alt="">` : `<span>${(comment.authorName || '?')[0].toUpperCase()}</span>`}
                </div>
                <div class="comment-username" onclick="window.location.href='/profile.html?uid=${comment.authorId}'">
                    ${escapeHtml(comment.authorName || 'Аноним')}
                </div>
                <span class="comment-time">${comment.createdAt ? new Date(comment.createdAt.seconds * 1000).toLocaleDateString('ru-RU') : 'недавно'}</span>
            </div>
            <div class="comment-text">
                ${parseBBC(comment.text || '')}
                ${comment.image ? `<br><img src="${comment.image}" class="comment-image" onclick="window.open('${comment.image}', '_blank')">` : ''}
            </div>
            <div class="comment-on">
                Комментарий к <a onclick="window.location.href='/post.html?id=${comment.postId}'">тейку</a>
            </div>
            <div class="comment-actions">
                <button onclick="voteComment('${comment.id}', 1)" class="${comment.likes && currentUser && comment.likes.includes(currentUser.uid) ? 'liked' : ''}">
                    <span class="material-icons" style="font-size:16px;">thumb_up</span>
                    ${comment.likes?.length || 0}
                </button>
                <button onclick="voteComment('${comment.id}', -1)" class="${comment.dislikes && currentUser && comment.dislikes.includes(currentUser.uid) ? 'disliked' : ''}">
                    <span class="material-icons" style="font-size:16px;">thumb_down</span>
                    ${comment.dislikes?.length || 0}
                </button>
                <span class="comment-score ${((comment.likes?.length || 0) - (comment.dislikes?.length || 0)) > 0 ? 'positive' : ((comment.likes?.length || 0) - (comment.dislikes?.length || 0)) < 0 ? 'negative' : ''}">
                    ${(comment.likes?.length || 0) - (comment.dislikes?.length || 0)}
                </span>
                ${comment.authorId === currentUser?.uid ? `
                    <button onclick="deleteComment('${comment.id}')" style="color:var(--red);">
                        <span class="material-icons" style="font-size:16px;">delete</span>
                    </button>
                ` : ''}
            </div>
        </div>
    `).join('');
}

function parseBBC(text) {
    if (!text) return '';
    let html = escapeHtml(text);
    html = html.replace(/\[b\](.*?)\[\/b\]/g, '<span class="bbc-bold">$1</span>');
    html = html.replace(/\[i\](.*?)\[\/i\]/g, '<span class="bbc-italic">$1</span>');
    html = html.replace(/\[u\](.*?)\[\/u\]/g, '<span class="bbc-underline">$1</span>');
    html = html.replace(/\[s\](.*?)\[\/s\]/g, '<span class="bbc-strike">$1</span>');
    html = html.replace(/\[code\](.*?)\[\/code\]/g, '<span class="bbc-code">$1</span>');
    html = html.replace(/\[quote\](.*?)\[\/quote\]/g, '<div class="bbc-quote">$1</div>');
    html = html.replace(/\[spoiler\](.*?)\[\/spoiler\]/g, '<span class="bbc-spoiler" onclick="this.style.color=\'var(--text-primary)\';">$1</span>');
    html = html.replace(/\[size=small\](.*?)\[\/size\]/g, '<span class="bbc-size-small">$1</span>');
    html = html.replace(/\[size=normal\](.*?)\[\/size\]/g, '<span class="bbc-size-normal">$1</span>');
    html = html.replace(/\[size=large\](.*?)\[\/size\]/g, '<span class="bbc-size-large">$1</span>');
    html = html.replace(/\[size=huge\](.*?)\[\/size\]/g, '<span class="bbc-size-huge">$1</span>');
    html = html.replace(/\[color=(#[0-9a-fA-F]{6})\](.*?)\[\/color\]/g, '<span class="bbc-color" style="color:$1;">$2</span>');
    html = html.replace(/\[bg=(#[0-9a-fA-F]{6})\](.*?)\[\/bg\]/g, '<span class="bbc-bg" style="background:$1;padding:2px 4px;border-radius:var(--radius);">$2</span>');
    html = html.replace(/\[url\](.*?)\[\/url\]/g, '<a href="$1" target="_blank" style="color:var(--accent);">$1</a>');
    html = html.replace(/\[url=(.*?)\](.*?)\[\/url\]/g, '<a href="$1" target="_blank" style="color:var(--accent);">$2</a>');
    html = html.replace(/\[img\](.*?)\[\/img\]/g, '<img src="$1" style="max-width:100%;max-height:300px;border-radius:var(--radius);margin:4px 0;" loading="lazy">');
    html = html.replace(/@([a-zA-Z0-9_.-]+)/g, '<span class="mention">@$1</span>');
    html = html.replace(/\n/g, '<br>');
    return html;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function voteComment(commentId, direction) {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    
    const commentRef = db.collection('comments').doc(commentId);
    
    for (const c of userComments) {
        if (c.id === commentId) {
            const uid = currentUser.uid;
            const wasLiked = c.likes && c.likes.includes(uid);
            const wasDisliked = c.dislikes && c.dislikes.includes(uid);
            if (direction === 1) {
                if (wasLiked) {
                    c.likes = c.likes.filter(id => id !== uid);
                } else {
                    c.likes = [...(c.likes || []), uid];
                    if (wasDisliked) c.dislikes = c.dislikes.filter(id => id !== uid);
                }
            } else {
                if (wasDisliked) {
                    c.dislikes = c.dislikes.filter(id => id !== uid);
                } else {
                    c.dislikes = [...(c.dislikes || []), uid];
                    if (wasLiked) c.likes = c.likes.filter(id => id !== uid);
                }
            }
            break;
        }
    }
    renderComments(userComments);
    
    db.runTransaction(transaction => {
        return transaction.get(commentRef).then(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            const likes = data.likes || [];
            const dislikes = data.dislikes || [];
            const uid = currentUser.uid;
            
            let newLikes = likes.filter(id => id !== uid);
            let newDislikes = dislikes.filter(id => id !== uid);
            
            if (direction === 1) {
                if (!likes.includes(uid)) newLikes.push(uid);
            } else if (direction === -1) {
                if (!dislikes.includes(uid)) newDislikes.push(uid);
            }
            
            transaction.update(commentRef, {
                likes: newLikes,
                dislikes: newDislikes
            });
        });
    }).catch(err => console.error('Vote comment error:', err));
}

function deleteComment(commentId) {
    if (!currentUser) return;
    if (!confirm('Удалить комментарий?')) return;
    
    db.collection('comments').doc(commentId).delete()
        .then(() => {
            loadUserComments(profileUserId);
        })
        .catch(err => alert('Ошибка: ' + err.message));
}

}

function toggleFollow() {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    if (!profileUser) return;

    const userRef = db.collection('users').doc(profileUser.id);
    const currentRef = db.collection('users').doc(currentUser.uid);

    const isFollowing = profileUser.followers && profileUser.followers.includes(currentUser.uid);

    db.runTransaction(transaction => {
        return transaction.get(userRef).then(doc => {
            const data = doc.data();
            let followers = data.followers || [];
            let following = [];
            
            return transaction.get(currentRef).then(doc2 => {
                const data2 = doc2.data();
                following = data2.following || [];
                
                if (isFollowing) {
                    followers = followers.filter(id => id !== currentUser.uid);
                    following = following.filter(id => id !== profileUser.id);
                } else {
                    followers.push(currentUser.uid);
                    following.push(profileUser.id);
                }
                
                transaction.update(userRef, { followers: followers });
                transaction.update(currentRef, { following: following });
            });
        });
    }).then(() => {
        if (isFollowing) {
            profileUser.followers = (profileUser.followers || []).filter(id => id !== currentUser.uid);
        } else {
            profileUser.followers = [...(profileUser.followers || []), currentUser.uid];
        }
        renderProfile(profileUser);
    }).catch(err => alert('Ошибка: ' + err.message));
}

function showFollowers(type) {
    if (!profileUser) return;
    const ids = type === 'followers' ? profileUser.followers : profileUser.following;
    if (!ids || !ids.length) {
        alert('Нет пользователей');
        return;
    }

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `

            <h3 style="margin-bottom:16px;">${type === 'followers' ? 'Подписчики' : 'Подписки'}</h3>
            <div id="followersList">
                <div class="loading-spinner"><span class="material-icons">refresh</span></div>

                    ${r.data.avatar ? `<img src="${r.data.avatar}" alt="">` : `<span>${(r.data.username || '?')[0].toUpperCase()}</span>`}
                </div>

                    <div class="name">${r.data.username || 'Аноним'}</div>
                    <div class="username">@${r.data.username || 'anonymous'}</div>
                </div>
            </div>
        `).join('');
    });
}

// ============================================================
// EDIT MODAL (через ImageBB)
// ============================================================
function openEditModal() {
    if (!currentUser || !profileUser) return;
    
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.id = 'editModal';
    
    const username = profileUser.username || '';
    const displayName = profileUser.displayName || username || '';
    const bio = profileUser.bio || '';
    const avatar = profileUser.avatar || '';
    const cover = profileUser.cover || '';
    
    modal.innerHTML = `
        <div class="modal-box">
            <div class="modal-header">
                <h2>Редактировать профиль</h2>
                <button class="close-btn" onclick="closeEditModal()">×</button>
            </div>
            
            <div class="edit-media-row">
                <div class="edit-avatar-box">
                    <div class="preview" id="editAvatarPreview" onclick="document.getElementById('avatarInput').click()">
                        ${avatar ? `<img src="${avatar}" alt="avatar">` : `<div class="empty-avatar">${(displayName || '?')[0].toUpperCase()}</div>`}
                        <div class="upload-overlay">
                            <span class="material-icons">photo_camera</span>
                        </div>
                    </div>
                    <div class="label">Аватар</div>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
                </div>
                
                <div class="edit-cover-box">
                    <div class="preview" id="editCoverPreview" onclick="document.getElementById('coverInput').click()">
                        ${cover ? `<img src="${cover}" alt="cover">` : `<div class="empty-cover">Шапка профиля</div>`}
                        <div class="upload-overlay">
                            <span class="material-icons">photo_camera</span>
                        </div>
                    </div>
                    <div class="label">Шапка</div>
                    <input type="file" id="coverInput" accept="image/*" style="display:none;" onchange="handleCoverUpload(event)">
                </div>
            </div>
            
            <div id="uploadProgressWrap" class="upload-progress-wrap">
                <div class="progress-bar">
                    <div class="progress-fill" id="uploadProgressFill"></div>
                </div>
                <div class="progress-text" id="uploadProgressText">Загрузка...</div>
                <div class="upload-error" id="uploadError"></div>
            </div>
            
            <div class="edit-field">
                <label>Отображаемое имя</label>
                <input type="text" id="editDisplayName" value="${escapeHtml(displayName)}" placeholder="Как вас называть">
            </div>
            
            <div class="edit-field">
                <label>Имя пользователя (уникальное)</label>
                <div class="input-prefix">
                    <span>@</span>
                    <input type="text" id="editUsername" value="${escapeHtml(username)}" 
                           placeholder="username" 
                           oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9_.-]/g, '')">
                </div>
                <div class="input-hint">
                    <span class="material-icons">info</span> Только латиница, цифры, _ . -
                </div>
            </div>
            
            <div class="edit-field">
                <label>Описание</label>
                <textarea id="editBio" placeholder="Расскажите о себе...">${escapeHtml(bio)}</textarea>
            </div>
            
            <div class="modal-actions">
                <button class="ripple-btn outline" onclick="closeEditModal()">Отмена</button>
                <button class="ripple-btn primary" id="saveProfileBtn" onclick="saveProfileChanges()">
                    <span class="material-icons">save</span> Сохранить
                </button>
            </div>
        </div>
    `;
    
    document.body.appendChild(modal);
}

function closeEditModal() {
    const modal = document.getElementById('editModal');
    if (modal) modal.remove();
    window._avatarFile = null;
    window._coverFile = null;
}

function handleAvatarUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const preview = document.getElementById('editAvatarPreview');
    const reader = new FileReader();
    reader.onload = function(e) {
        preview.innerHTML = `
            <img src="${e.target.result}" alt="avatar">
            <div class="upload-overlay">
                <span class="material-icons">photo_camera</span>
            </div>
        `;
    };
    reader.readAsDataURL(file);
    
    window._avatarFile = file;
    document.getElementById('uploadError').style.display = 'none';
}

function handleCoverUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const preview = document.getElementById('editCoverPreview');
    const reader = new FileReader();
    reader.onload = function(e) {
        preview.innerHTML = `
            <img src="${e.target.result}" alt="cover">
            <div class="upload-overlay">
                <span class="material-icons">photo_camera</span>
            </div>
        `;
    };
    reader.readAsDataURL(file);
    
    window._coverFile = file;
    document.getElementById('uploadError').style.display = 'none';
}

function saveProfileChanges() {
    const displayName = document.getElementById('editDisplayName').value.trim() || 'Пользователь';
    const username = document.getElementById('editUsername').value.trim();
    const bio = document.getElementById('editBio').value.trim();
    
    if (!username || username.length < 2) {
        alert('Имя пользователя должно быть минимум 2 символа');
        return;
    }
    
    if (!/^[a-z0-9_.-]+$/.test(username)) {
        alert('Имя пользователя может содержать только латиницу, цифры, _ . -');
        return;
    }
    
    const btn = document.getElementById('saveProfileBtn');
    const progressWrap = document.getElementById('uploadProgressWrap');
    const progressFill = document.getElementById('uploadProgressFill');
    const progressText = document.getElementById('uploadProgressText');
    const errorEl = document.getElementById('uploadError');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="material-icons" style="animation:spin 1s linear infinite;">refresh</span> Сохранение...';
    errorEl.style.display = 'none';
    errorEl.textContent = '';
    
    let updates = { displayName: displayName, username: username, bio: bio };
    let uploadPromises = [];
    let totalUploads = 0;
    let completedUploads = 0;
    let hasError = false;
    
    function updateProgress() {
        completedUploads++;
        const percent = totalUploads > 0 ? Math.round((completedUploads / totalUploads) * 100) : 100;
        progressFill.style.width = percent + '%';
        progressText.textContent = `Загрузка... ${percent}%`;
    }
    
    function showError(message) {
        hasError = true;
        errorEl.style.display = 'block';
        errorEl.textContent = '❌ ' + message;
        console.error('Upload error:', message);
    }
    
    if (window._avatarFile) {
        totalUploads++;
        progressWrap.style.display = 'block';
        progressText.textContent = 'Загрузка аватара...';
        
        const formData = new FormData();
        formData.append('key', IMGBB_API_KEY);
        formData.append('image', window._avatarFile);
        
        const promise = fetch('https://api.imgbb.com/1/upload', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                updates.avatar = data.data.url;
                updateProgress();
                return data.data.url;
            } else {
                showError('Ошибка загрузки аватара: ' + (data.error?.message || 'Unknown'));
                throw new Error(data.error?.message || 'Upload failed');
            }
        })
        .catch(err => {
            showError('Ошибка загрузки аватара: ' + err.message);
            throw err;
        });
        uploadPromises.push(promise);
    }
    
    if (window._coverFile) {
        totalUploads++;
        if (!progressWrap.style.display || progressWrap.style.display === 'none') {
            progressWrap.style.display = 'block';
        }
        progressText.textContent = 'Загрузка шапки...';
        
        const formData = new FormData();
        formData.append('key', IMGBB_API_KEY);
        formData.append('image', window._coverFile);
        
        const promise = fetch('https://api.imgbb.com/1/upload', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                updates.cover = data.data.url;
                updateProgress();
                return data.data.url;
            } else {
                showError('Ошибка загрузки шапки: ' + (data.error?.message || 'Unknown'));
                throw new Error(data.error?.message || 'Upload failed');
            }
        })
        .catch(err => {
            showError('Ошибка загрузки шапки: ' + err.message);
            throw err;
        });
        uploadPromises.push(promise);
    }
    
    if (totalUploads === 0) {
        progressWrap.style.display = 'none';
    }
    
    Promise.all(uploadPromises)
        .then(() => {
            if (totalUploads > 0) {
                progressText.textContent = 'Сохранение данных...';
                progressFill.style.width = '100%';
            }
            return db.collection('users').doc(currentUser.uid).update(updates);
        })
        .then(() => {
            return currentUser.updateProfile({ displayName: displayName });
        })
        .then(() => {
            progressText.textContent = 'Готово!';
            setTimeout(() => {
                closeEditModal();
                loadProfile(profileUserId);
            }, 500);
        })
        .catch(err => {
            console.error('Save error:', err);
            if (!hasError) {
                showError('Ошибка сохранения: ' + err.message);
            }
            btn.disabled = false;
            btn.innerHTML = '<span class="material-icons">save</span> Сохранить';
        });
}
