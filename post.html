    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1c1c1c;
            --bg-hover: #2a2a2a;
            --bg-input: #252525;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --border-color: #2c2c2c;
            --border-light: #3a3a3a;
            --accent: #4f8cff;
            --accent-hover: #6b9fff;
            --accent-light: rgba(79, 140, 255, 0.15);
            --green: #4caf50;
            --red: #f44336;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --radius: 4px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --topbar-height: 60px;
            --online-color: #4caf50;
            --tag-anarchism-color: #ffffff;
            --tag-fascism-color: #ffffff;
            --tag-authoritarianism-color: #8b0000;
            --post-content-bg: transparent;
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f0;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #e8e8e8;
            --bg-input: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --border-light: #d0d0d0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --tag-anarchism-color: #000000;
            --tag-fascism-color: #000000;
            --tag-authoritarianism-color: #8b0000;
            --post-content-bg: #f5f5f5;
        }

        html {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: var(--radius); }

        .container { max-width: 900px; margin: 0 auto; padding: 0 16px; width: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .flex-col { display: flex; flex-direction: column; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .gap-16 { gap: 16px; }
        .gap-24 { gap: 24px; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.4; }
            100% { transform: scale(4); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-fade { animation: fadeIn 0.25s ease-out; }
        .animate-slide { animation: slideUp 0.3s ease-out; }

        /* ===== RIPPLE BUTTON ===== */
        .ripple-btn {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
            background: none;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius);
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .ripple-btn .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            animation: ripple 0.5s ease-out;
            pointer-events: none;
        }

        [data-theme="light"] .ripple-btn .ripple-effect {
            background: rgba(0, 0, 0, 0.1);
        }

        .ripple-btn:hover { background: var(--bg-hover); }
        .ripple-btn:active { transform: scale(0.96); }

        .ripple-btn.primary {
            background: var(--accent);
            color: #fff;
        }
        .ripple-btn.primary:hover { background: var(--accent-hover); }

        .ripple-btn.outline {
            border: 1px solid var(--border-color);
        }
        .ripple-btn.outline:hover { background: var(--bg-hover); }

        /* ===== TOP BAR ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            min-height: var(--topbar-height);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .topbar-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .topbar-logo span { color: var(--accent); }

        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .topbar-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar-nav a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .topbar-nav a.active {
            color: var(--accent);
            background: var(--accent-light);
        }

        .topbar-nav a .material-icons { font-size: 20px; }
        .topbar-nav a span:not(.material-icons) { display: inline; }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .topbar-actions .material-icons {
            font-size: 22px;
            color: var(--text-secondary);
        }

        .topbar-actions .avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .topbar-actions .avatar-small:hover {
            border-color: var(--accent);
        }

        .topbar-actions .avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .topbar-actions .avatar-small .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
            z-index: 2;
        }

        .topbar-actions .avatar-small .online-dot.show {
            display: block;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 160px;
        }

        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            padding: 6px 6px;
            width: 100%;
            min-width: 60px;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
            font-size: 12px;
        }

        .search-bar .material-icons {
            color: var(--text-muted);
            font-size: 18px;
        }

        /* ===== POST VIEW ===== */
        .post-view {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            margin: 16px 0;
        }

        .post-view .post-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 8px;
        }

        .post-view .post-avatar-wrap {
            flex-shrink: 0;
            position: relative;
        }

        .post-view .post-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .post-view .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-view .post-avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
            z-index: 2;
        }

        .post-view .post-avatar .online-dot.show {
            display: block;
        }

        .post-view .post-user {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        .post-view .post-username {
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .post-view .post-username:hover { color: var(--accent); }

        .post-view .post-badge {
            font-size: 11px;
            background: var(--accent-light);
            color: var(--accent);
            padding: 1px 10px;
            border-radius: 10px;
            font-weight: 500;
        }

        .post-view .post-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .post-view .post-meta .community-wrap {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--accent);
            cursor: pointer;
        }

        .post-view .post-meta .community-wrap:hover { text-decoration: underline; }

        .post-view .post-meta .community-wrap .community-avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-hover);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .post-view .post-meta .community-wrap .community-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-view .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 2px;
        }

        .post-view .post-tag {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        .post-view .post-tag:hover { opacity: 0.8; }

        .post-view .post-title {
            font-size: 26px;
            font-weight: 800;
            margin: 12px 0 14px;
            line-height: 1.3;
        }

        .post-view .post-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 16px;
            word-wrap: break-word;
            padding: 12px;
            border-radius: var(--radius);
            background: var(--post-content-bg);
        }

        .post-view .post-content .mention {
            color: var(--accent);
            font-weight: 500;
            cursor: pointer;
        }

        .post-view .post-content .mention:hover { text-decoration: underline; }

        .post-view .post-images {
            display: grid;
            gap: 6px;
            margin: 14px 0;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .post-view .post-images .img-wrap {
            position: relative;
            background: var(--bg-hover);
            overflow: hidden;
            cursor: pointer;
            border-radius: var(--radius);
        }

        .post-view .post-images .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .post-view .post-images .img-wrap:hover img { transform: scale(1.02); }

        .post-view .post-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .post-view .post-action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .post-view .post-action-btn:hover { background: var(--bg-hover); }
        .post-view .post-action-btn .material-icons { font-size: 20px; }

        .post-view .post-action-btn.liked { color: var(--green); }
        .post-view .post-action-btn.liked .material-icons { font-variation-settings: 'FILL' 1; }
        .post-view .post-action-btn.disliked { color: var(--red); }
        .post-view .post-action-btn.disliked .material-icons { font-variation-settings: 'FILL' 1; }

        .post-view .post-score {
            font-weight: 700;
            font-size: 17px;
            min-width: 30px;
            text-align: center;
        }

        .post-view .post-score.positive { color: var(--green); }
        .post-view .post-score.negative { color: var(--red); }

        /* ===== COMMENTS ===== */
        .comments-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .comments-section h3 {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .comments-section h3 span { color: var(--text-muted); font-weight: 400; font-size: 15px; }

        .comment-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .comment-input-area .comment-avatar-small {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--bg-hover);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            position: relative;
        }

        .comment-input-area .comment-avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-input-area .comment-avatar-small .online-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
            z-index: 2;
        }

        .comment-input-area .comment-avatar-small .online-dot.show {
            display: block;
        }

        .comment-input-area .comment-input-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .comment-input-area textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 14px;
            resize: vertical;
            min-height: 56px;
            outline: none;
            transition: border-color 0.2s;
        }

        .comment-input-area textarea:focus {
            border-color: var(--accent);
        }

        .comment-input-area .comment-actions-row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .comment-input-area .comment-actions-row .ripple-btn {
            padding: 5px 14px;
            font-size: 12px;
        }

        .comment-images-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .comment-images-preview .img-wrap {
            width: 60px;
            height: 60px;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--bg-hover);
            position: relative;
            border: 1px solid var(--border-color);
        }

        .comment-images-preview .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-images-preview .img-wrap .remove-img {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== COMMENT (РЕКУРСИВНАЯ ВЛОЖЕННОСТЬ) ===== */

function parseBBC(text) {
    if (!text) return '';
    
    let html = escapeHtml(text);
    
    html = html.replace(/\[b\](.*?)\[\/b\]/g, '<span class="bbc-bold">$1</span>');
    html = html.replace(/\[i\](.*?)\[\/i\]/g, '<span class="bbc-italic">$1</span>');
    html = html.replace(/\[u\](.*?)\[\/u\]/g, '<span class="bbc-underline">$1</span>');
    html = html.replace(/\[s\](.*?)\[\/s\]/g, '<span class="bbc-strike">$1</span>');
    html = html.replace(/\[code\](.*?)\[\/code\]/g, '<span class="bbc-code">$1</span>');
    html = html.replace(/\[quote\](.*?)\[\/quote\]/g, '<div class="bbc-quote">$1</div>');
    html = html.replace(/\[spoiler\](.*?)\[\/spoiler\]/g, '<span class="bbc-spoiler" onclick="event.stopPropagation();this.style.color=\'var(--text-primary)\';">$1</span>');
    html = html.replace(/\[size=small\](.*?)\[\/size\]/g, '<span class="bbc-size-small">$1</span>');
    html = html.replace(/\[size=normal\](.*?)\[\/size\]/g, '<span class="bbc-size-normal">$1</span>');
    html = html.replace(/\[size=large\](.*?)\[\/size\]/g, '<span class="bbc-size-large">$1</span>');
    html = html.replace(/\[size=huge\](.*?)\[\/size\]/g, '<span class="bbc-size-huge">$1</span>');
    html = html.replace(/\[color=(#[0-9a-fA-F]{6})\](.*?)\[\/color\]/g, '<span class="bbc-color" style="color:$1;">$2</span>');
    html = html.replace(/\[bg=(#[0-9a-fA-F]{6})\](.*?)\[\/bg\]/g, '<span class="bbc-bg" style="background:$1;padding:2px 4px;border-radius:var(--radius);">$2</span>');
    html = html.replace(/\[url\](.*?)\[\/url\]/g, '<a href="$1" target="_blank" style="color:var(--accent);">$1</a>');
    html = html.replace(/\[url=(.*?)\](.*?)\[\/url\]/g, '<a href="$1" target="_blank" style="color:var(--accent);">$2</a>');
    html = html.replace(/\[img\](.*?)\[\/img\]/g, '<img src="$1" style="max-width:100%;max-height:300px;border-radius:var(--radius);margin:4px 0;" loading="lazy">');
    
    html = html.replace(/@([a-zA-Z0-9_.-]+)/g, '<span class="mention" onclick="goToProfileByUsername(\'$1\')">@$1</span>');
    
    html = html.replace(/\n/g, '<br>');
    
    return html;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================================
// ОНЛАЙН СТАТУС
// ============================================================
function updateLastActivity() {
    lastActivityTime = Date.now();
    if (!isUserOnline && currentUser) {
        isUserOnline = true;
        updateOnlineStatus(true);
    }
}

function updateOnlineStatus(status) {
    if (!currentUser) return;
    db.collection('users').doc(currentUser.uid).update({
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        isOnline: status
    }).catch(() => {});
}

function checkOnlineStatus() {
    if (!currentUser) return;
    const now = Date.now();
    const inactiveTime = (now - lastActivityTime) / 1000;
    if (inactiveTime > 120 && isUserOnline) {
        isUserOnline = false;
        updateOnlineStatus(false);
    }
}

function startOnlineTracking() {
    if (onlineCheckInterval) clearInterval(onlineCheckInterval);
    lastActivityTime = Date.now();
    isUserOnline = true;
    updateOnlineStatus(true);
    onlineCheckInterval = setInterval(checkOnlineStatus, 30000);
    const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'click', 'input', 'focus'];
    events.forEach(event => {
        document.addEventListener(event, updateLastActivity);
    });
    window.addEventListener('beforeunload', () => {
        if (currentUser) {
            db.collection('users').doc(currentUser.uid).update({
                isOnline: false,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
        }
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (currentUser) {
                isUserOnline = false;
                db.collection('users').doc(currentUser.uid).update({
                    isOnline: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
            }
        } else {
            lastActivityTime = Date.now();
            isUserOnline = true;
            updateOnlineStatus(true);
        }
    });
}

function checkUserOnline(uid) {
    return db.collection('users').doc(uid).get()
        .then(doc => {
            if (doc.exists) {
                const data = doc.data();
                if (data.isOnline === true) return true;
                if (data.lastSeen) {
                    const lastSeen = data.lastSeen.seconds * 1000;
                    const now = Date.now();
                    return (now - lastSeen) < 120000;
                }
            }
            return false;
        })
        .catch(() => false);
}

function createUserInFirestore(user) {
    return db.collection('users').doc(user.uid).get().then(doc => {
        if (!doc.exists) {
            let username = user.displayName || 'user_' + Date.now().toString(36);
            username = username.toLowerCase().replace(/[^a-z0-9_.-]/g, '');
            if (!username || username.length < 2) {
                username = 'user_' + Date.now().toString(36);
            }
            return db.collection('users').doc(user.uid).set({
                username: username,
                displayName: user.displayName || username,
                email: user.email || '',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                avatar: user.photoURL || null,
                cover: null,
                bio: '',
                reputation: 0,
                followers: [],
                following: [],
                theme: currentTheme,
                isOnline: true,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        return doc;
    });
}

function openImageViewer(url) {
    const viewer = document.getElementById('imageViewer');
    document.getElementById('viewerImage').src = url;
    viewer.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeImageViewer() {
    document.getElementById('imageViewer').classList.add('hidden');
    document.body.style.overflow = '';
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('themeToggle').addEventListener('click', () => {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        localStorage.setItem('takean-theme', currentTheme);
        document.getElementById('themeToggle').innerHTML =

    });

                </button>

});

function setupEventListeners() {

function loadUserData() {
    const user = auth.currentUser;
    currentUser = user;
    
    const avatarEl = document.getElementById('userAvatar');
    const dotEl = document.getElementById('userOnlineDot');
    
    if (user) {
        avatarEl.innerHTML = user.photoURL 
            ? `<img src="${user.photoURL}" alt="avatar">` 
            : `<span>${(user.displayName || '?')[0].toUpperCase()}</span>`;
        avatarEl.onclick = () => window.location.href = `/profile.html?uid=${user.uid}`;
        dotEl.classList.add('show');
        createUserInFirestore(user).then(() => {
            startOnlineTracking();

        avatarEl.onclick = () => window.location.href = '/login.html';
        dotEl.classList.remove('show');
        if (onlineCheckInterval) {

            onlineCheckInterval = null;
        }
    }
}

// LOAD POST
// ============================================================
function loadPost(id) {
    const container = document.getElementById('postContainer');
    container.innerHTML = '<div class="loading-spinner"><span class="material-icons">refresh</span> Загрузка...</div>';

    db.collection('posts').doc(id).get()
        .then(doc => {
            if (!doc.exists) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">inbox</span>
                        <h3 style="font-weight:500;">Тейк не найден</h3>
                        <p style="font-size:14px;">Возможно, он был удалён</p>
                        <button class="ripple-btn primary" style="margin-top:12px;" onclick="window.location.href='/'">
                            На главную
                        </button>
                    </div>
                `;
                return;
            }
            
            currentPost = { id: doc.id, ...doc.data() };
            
            let communityPromise = Promise.resolve();
            let communityData = null;
            if (currentPost.communityId) {
                communityPromise = db.collection('communities').doc(currentPost.communityId).get()
                    .then(doc => {
                        if (doc.exists) communityData = doc.data();
                    })
                    .catch(() => {});
            }
            
            let authorOnline = false;
            const authorPromise = checkUserOnline(currentPost.authorId).then(isOnline => {
                authorOnline = isOnline;
            });
            
            Promise.all([communityPromise, authorPromise])
                .then(() => {
                    currentPost._communityData = communityData;
                    currentPost._authorOnline = authorOnline;
                    
                    const title = currentPost.title || 'Тейк на Takean';
                    const description = (currentPost.content || '').substring(0, 200) + '...';
                    const image = currentPost.images && currentPost.images.length > 0 
                        ? currentPost.images[0] 
                        : 'https://takean.pages.dev/og-image.png';
                    const url = window.location.href;
                    
                    document.title = `${title} | Takean`;
                    
                    const metaMap = {
                        'og:title': title,
                        'og:description': description,
                        'og:image': image,
                        'og:url': url,
                        'twitter:title': title,
                        'twitter:description': description,
                        'twitter:image': image
                    };
                    
                    for (const [property, content] of Object.entries(metaMap)) {
                        let meta = document.querySelector(`meta[property="${property}"]`);
                        if (!meta) {
                            meta = document.querySelector(`meta[name="${property}"]`);
                        }
                        if (meta) {
                            meta.setAttribute('content', content);
                        }
                    }
                    
                    renderPost(currentPost);
                    loadComments(postId);
                });
        })
        .catch(err => {
            console.error('Load post error:', err);
            container.innerHTML = `
                <div class="error-state">
                    <span class="material-icons">error</span>
                    <h3 style="font-weight:500;">Ошибка загрузки тейка</h3>
                    <div class="error-details">${err.message}</div>
                    <button class="ripple-btn primary" style="margin-top:12px;" onclick="loadPost('${id}')">
                        <span class="material-icons">refresh</span> Повторить
                    </button>
                </div>
            `;
        });
}

// RENDER POST
// ============================================================
function renderPost(post) {
    const container = document.getElementById('postContainer');
    const isLiked = post.likes && currentUser && post.likes.includes(currentUser.uid);
    const isDisliked = post.dislikes && currentUser && post.dislikes.includes(currentUser.uid);
    const score = (post.likes?.length || 0) - (post.dislikes?.length || 0);
    const scoreClass = score > 0 ? 'positive' : score < 0 ? 'negative' : '';
    const textColor = post.textColor || 'var(--text-secondary)';
    const bgColor = post.bgColor || 'var(--post-content-bg)';
    const isOnline = post._authorOnline || false;
    const communityData = post._communityData || null;
    
    const timeStr = post.createdAt 
        ? new Date(post.createdAt.seconds * 1000).toLocaleString('ru-RU', { 
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          })
        : 'недавно';
    
    let tagsHtml = '';
    if (post.category) {
        const categories = post.category.split(',').map(c => c.trim());
        categories.forEach(cat => {
            const tagClass = getTagClass(cat);
            const displayName = getTagDisplayName(cat);
            tagsHtml += `<span class="post-tag ${tagClass}" onclick="applyFilter('${cat}')">#${displayName}</span>`;
        });
    }
    
    let communityHtml = '';
    if (post.communityId && communityData) {
        const communityName = communityData.name || post.community || 'Сообщество';
        const communityAvatar = communityData.avatar || '';
        communityHtml = `
            <span class="community-wrap" onclick="goToCommunity('${post.communityId}')">
                <span class="material-icons" style="font-size:16px;">arrow_forward</span>
                <span class="community-avatar">
                    ${communityAvatar ? `<img src="${communityAvatar}" alt="">` : `<span class="material-icons" style="font-size:14px;">group</span>`}
                </span>
                ${escapeHtml(communityName)}
            </span>
        `;
    } else if (post.community) {
        communityHtml = `<span>• ${escapeHtml(post.community)}</span>`;
    }
    
    let imagesHtml = '';
    if (post.images && post.images.length) {
        const count = post.images.length;
        if (count === 1) {
            imagesHtml = `
                <div class="post-images" style="grid-template-columns:1fr;">
                    ${post.images.map(img => `
                        <div class="img-wrap" onclick="openImageViewer('${img}')">
                            <img src="${img}" alt="post image" loading="lazy">
                        </div>
                    `).join('')}
                </div>
            `;
        } else if (count === 2) {
            imagesHtml = `
                <div class="post-images" style="grid-template-columns:1fr 1fr;">
                    ${post.images.map(img => `
                        <div class="img-wrap" onclick="openImageViewer('${img}')">
                            <img src="${img}" alt="post image" loading="lazy">
                        </div>
                    `).join('')}
                </div>
            `;
        } else if (count === 3) {
            imagesHtml = `
                <div class="post-images" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;">
                    <div class="img-wrap" style="grid-row:1/3;" onclick="openImageViewer('${post.images[0]}')">
                        <img src="${post.images[0]}" alt="post image" loading="lazy">
                    </div>
                    ${post.images.slice(1, 3).map(img => `
                        <div class="img-wrap" onclick="openImageViewer('${img}')">
                            <img src="${img}" alt="post image" loading="lazy">
                        </div>
                    `).join('')}
                </div>
            `;
        } else {
            imagesHtml = `
                <div class="post-images" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;">
                    ${post.images.slice(0, 4).map(img => `
                        <div class="img-wrap" onclick="openImageViewer('${img}')">
                            <img src="${img}" alt="post image" loading="lazy">
                        </div>
                    `).join('')}
                </div>
            `;
        }
    }
    
    container.innerHTML = `
        <div class="post-view">
            <div class="post-header">
                <div class="post-avatar-wrap">
                    <div class="post-avatar" onclick="goToProfile('${post.authorId}')">
                        ${post.authorAvatar 
                            ? `<img src="${post.authorAvatar}" alt="">` 
                            : `<span>${(post.authorName || '?')[0].toUpperCase()}</span>`}
                        <span class="online-dot ${isOnline ? 'show' : ''}"></span>
                    </div>
                </div>
                <div class="post-user">
                    <div class="post-username" onclick="goToProfile('${post.authorId}')">
                        ${escapeHtml(post.authorName || 'Аноним')}
                        ${post.authorBadge ? `<span class="post-badge">${escapeHtml(post.authorBadge)}</span>` : ''}
                    </div>
                    <div class="post-meta">
                        <span>${timeStr}</span>
                        ${communityHtml}
                    </div>
                    ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
                </div>
                ${post.authorId === currentUser?.uid ? `
                    <div style="margin-left:auto;display:flex;gap:4px;">
                        <button class="ripple-btn" onclick="deletePost()" style="color:var(--red);padding:4px 10px;">
                            <span class="material-icons" style="font-size:18px;">delete</span>
                        </button>
                    </div>

            </div>
            
            <h1 class="post-title">${escapeHtml(post.title || 'Без заголовка')}</h1>
            
            <div class="post-content" style="color:${textColor};background:${bgColor};">

                </button>
                <span class="post-score ${scoreClass}">${score}</span>
                <button class="post-action-btn" onclick="sharePost()">

                <button class="post-action-btn" onclick="copyLink()">

        </div>
        
        <div class="comments-section" id="commentsSection">
            <h3>Комментарии <span id="commentsCount">${post.commentsCount || 0}</span></h3>
            
            <div class="comment-input-area">
                <div class="comment-avatar-small" id="commentAvatar">
                    ${currentUser?.photoURL 
                        ? `<img src="${currentUser.photoURL}" alt="">` 
                        : `<span>${currentUser?.displayName?.[0] || '?'}</span>`}
                    <span class="online-dot ${currentUser ? 'show' : ''}"></span>
                </div>
                <div class="comment-input-wrap">
                    <textarea id="commentInput" placeholder="Напишите комментарий... (поддерживает @упоминания)"></textarea>
                    <div class="comment-actions-row">
                        <button class="ripple-btn outline" onclick="addCommentImage()" style="padding:4px 10px;font-size:12px;">
                            <span class="material-icons" style="font-size:16px;">image</span> Фото

                    <input type="file" id="commentImageInput" accept="image/*" multiple style="display:none;" onchange="handleCommentImageUpload(event)">
                </div>

            </div>
        </div>
    `;
}

// ============================================================
// VOTE SYSTEM
// ============================================================
function votePost(direction) {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    if (!currentPost) return;
    
    const uid = currentUser.uid;
    const wasLiked = currentPost.likes && currentPost.likes.includes(uid);
    const wasDisliked = currentPost.dislikes && currentPost.dislikes.includes(uid);
    
    if (direction === 1) {
        if (wasLiked) {
            currentPost.likes = currentPost.likes.filter(id => id !== uid);
        } else {
            currentPost.likes = [...(currentPost.likes || []), uid];
            if (wasDisliked) {
                currentPost.dislikes = currentPost.dislikes.filter(id => id !== uid);
            }
        }
    } else if (direction === -1) {
        if (wasDisliked) {
            currentPost.dislikes = currentPost.dislikes.filter(id => id !== uid);
        } else {
            currentPost.dislikes = [...(currentPost.dislikes || []), uid];
            if (wasLiked) {
                currentPost.likes = currentPost.likes.filter(id => id !== uid);
            }
        }
    }
    
    renderPost(currentPost);
    
    const postRef = db.collection('posts').doc(currentPost.id);
    db.runTransaction(transaction => {
        return transaction.get(postRef).then(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            const likes = data.likes || [];
            const dislikes = data.dislikes || [];
            
            let newLikes = likes.filter(id => id !== uid);
            let newDislikes = dislikes.filter(id => id !== uid);
            
            if (direction === 1) {
                if (!likes.includes(uid)) newLikes.push(uid);
            } else if (direction === -1) {
                if (!dislikes.includes(uid)) newDislikes.push(uid);
            }
            
            transaction.update(postRef, {
                likes: newLikes,
                dislikes: newDislikes
            });
        });
    }).catch(err => console.error('Vote error:', err));
}

function sharePost() {
    const url = window.location.href;
    if (navigator.share) {
        navigator.share({ title: currentPost?.title || 'Тейк на Takean', url });
    } else {
        copyLink();
    }
}

function copyLink() {
    const url = window.location.href;
    navigator.clipboard.writeText(url).then(() => {
        alert('Ссылка скопирована!');
    }).catch(() => {
        prompt('Скопируйте ссылку:', url);
    });
}

function deletePost() {
    if (!currentUser || currentPost.authorId !== currentUser.uid) return;
    if (!confirm('Удалить этот тейк?')) return;
    
    db.collection('posts').doc(currentPost.id).delete()
        .then(() => {
            alert('Тейк удалён');
            window.location.href = '/';
        })
        .catch(err => alert('Ошибка: ' + err.message));
}

// ============================================================
// COMMENTS (РЕКУРСИВНАЯ ВЛОЖЕННОСТЬ)
// ============================================================
function loadComments(postId) {
    const container = document.getElementById('commentsContainer');
    container.innerHTML = '<div class="loading-spinner"><span class="material-icons">refresh</span> Загрузка...</div>';

    db.collection('comments')
        .where('postId', '==', postId)
        .orderBy('createdAt', 'asc')
        .get()
        .then(snapshot => {
            const allComments = [];
            const promises = [];
            
            snapshot.forEach(doc => {
                allComments.push({ id: doc.id, ...doc.data() });
            });
            
            // Строим дерево: корневые и их ответы рекурсивно
            const rootComments = [];
            const commentMap = {};
            
            allComments.forEach(c => {
                commentMap[c.id] = { ...c, replies: [], _authorOnline: false };
            });
            
            allComments.forEach(c => {
                if (c.parentId && commentMap[c.parentId]) {
                    commentMap[c.parentId].replies.push(commentMap[c.id]);
                } else if (!c.parentId) {
                    rootComments.push(commentMap[c.id]);
                }
            });
            
            // Сортируем по дате рекурсивно
            const sortRecursive = (list) => {
                list.sort((a, b) => {
                    const aTime = a.createdAt?.seconds || 0;
                    const bTime = b.createdAt?.seconds || 0;
                    return aTime - bTime;
                });
                list.forEach(c => {
                    if (c.replies && c.replies.length) {
                        sortRecursive(c.replies);
                    }
                });
            };
            sortRecursive(rootComments);
            
            // Онлайн статус
            const userIds = new Set();
            allComments.forEach(c => {
                if (c.authorId) userIds.add(c.authorId);
            });
            
            userIds.forEach(uid => {
                promises.push(
                    checkUserOnline(uid).then(isOnline => {
                        const updateStatus = (list) => {
                            list.forEach(c => {
                                if (c.authorId === uid) {
                                    c._authorOnline = isOnline;
                                }
                                if (c.replies && c.replies.length) {
                                    updateStatus(c.replies);
                                }
                            });
                        };
                        updateStatus(rootComments);
                    })
                );
            });
            
            return Promise.all(promises).then(() => {
                comments = rootComments;
                renderComments();
            });
        })
        .catch(err => {
            console.error('Load comments error:', err);
            container.innerHTML = `
                <div class="error-state">
                    <span class="material-icons">error</span>
                    <h3 style="font-weight:500;">Ошибка загрузки комментариев</h3>
                    <div class="error-details">${err.message}</div>
                    <button class="ripple-btn primary" style="margin-top:12px;" onclick="loadComments('${postId}')">
                        <span class="material-icons">refresh</span> Повторить
                    </button>
                </div>
            `;
        });
}

function renderComments() {
    const container = document.getElementById('commentsContainer');
    if (!container) return;
    
    if (!comments || !comments.length) {
        container.innerHTML = `
            <div class="empty-state" style="padding:20px;">
                <span class="material-icons" style="font-size:32px;">chat_bubble_outline</span>
                <p style="font-size:14px;">Пока нет комментариев. Будьте первым!</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = comments.map(root => renderCommentTree(root, 0)).join('');
    
    // Обновляем счётчик
    let total = 0;
    const countAll = (list) => {
        list.forEach(c => {
            total++;
            if (c.replies && c.replies.length) {
                countAll(c.replies);
            }
        });
    };
    countAll(comments);
    const countEl = document.getElementById('commentsCount');
    if (countEl) countEl.textContent = total;
}

function renderCommentTree(comment, depth) {
    const html = createCommentHTML(comment, false, null);
    
    let repliesHtml = '';
    if (comment.replies && comment.replies.length) {
        repliesHtml = comment.replies.map(reply => {
            const parentName = comment.authorName || 'пользователь';
            return renderCommentTree(reply, depth + 1);
        }).join('');
    }
    
    // Первый уровень — корневой комментарий без палочки, ответы — с палочкой
    if (depth === 0) {
        return `
            <div class="comment-tree">
                ${html}
                ${repliesHtml ? `<div class="comment-reply">${repliesHtml}</div>` : ''}
            </div>
        `;
    } else {
        // Вложенный ответ — уже внутри comment-reply
        return html + (repliesHtml ? `<div class="comment-reply">${repliesHtml}</div>` : '');
    }
}

function createCommentHTML(comment, isReply, parentName) {
    const isLiked = comment.likes && currentUser && comment.likes.includes(currentUser.uid);
    const isDisliked = comment.dislikes && currentUser && comment.dislikes.includes(currentUser.uid);
    const score = (comment.likes?.length || 0) - (comment.dislikes?.length || 0);
    const scoreClass = score > 0 ? 'positive' : score < 0 ? 'negative' : '';
    const isOnline = comment._authorOnline || false;
    const timeStr = comment.createdAt 
        ? new Date(comment.createdAt.seconds * 1000).toLocaleString('ru-RU', { 
            hour: '2-digit', minute: '2-digit', 
            day: '2-digit', month: '2-digit' 
          })
        : 'недавно';
    
    let imagesHtml = '';
    if (comment.images && comment.images.length) {
        imagesHtml = `
            <div class="comment-images-grid">
                ${comment.images.map(img => `
                    <div class="img-wrap" onclick="openImageViewer('${img}')">
                        <img src="${img}" alt="comment image" loading="lazy">
                    </div>
                `).join('')}
            </div>
        `;
    }
    
    // Показываем "Ответ для @username" только если это ответ (parentId существует)
    let replyToHtml = '';
    if (comment.parentId && parentName && comment.authorName !== parentName) {
        replyToHtml = `
            <div class="comment-reply-to">
                <span class="material-icons">reply</span>
                Ответ для <span class="reply-to-name" onclick="scrollToComment('${comment.parentId}')">@${escapeHtml(parentName)}</span>
            </div>
        `;
    }
    
    return `
        <div class="comment" id="comment-${comment.id}">
            <div class="comment-header">
                <div class="comment-avatar-wrap">
                    <div class="comment-avatar" onclick="goToProfile('${comment.authorId}')">
                        ${comment.authorAvatar 
                            ? `<img src="${comment.authorAvatar}" alt="">` 
                            : `<span>${(comment.authorName || '?')[0].toUpperCase()}</span>`}
                        <span class="online-dot ${isOnline ? 'show' : ''}"></span>
                    </div>
                </div>
                <div class="comment-username" onclick="goToProfile('${comment.authorId}')">
                    ${escapeHtml(comment.authorName || 'Аноним')}
                </div>
                <span class="comment-time">${timeStr}</span>
            </div>
            
            ${replyToHtml}
            
            <div class="comment-text">
                ${parseBBC(comment.text || '')}
                ${imagesHtml}
            </div>
            
            <div class="comment-actions">
                <button onclick="voteComment('${comment.id}', 1)" class="${isLiked ? 'liked' : ''}">
                    <span class="material-icons" style="font-size:16px;">thumb_up</span>
                    <span class="vote-count">${comment.likes?.length || 0}</span>
                </button>
                <button onclick="voteComment('${comment.id}', -1)" class="${isDisliked ? 'disliked' : ''}">
                    <span class="material-icons" style="font-size:16px;">thumb_down</span>
                    <span class="vote-count">${comment.dislikes?.length || 0}</span>
                </button>
                <span class="comment-score ${scoreClass}">${score}</span>
                <button onclick="showReplyForm('${comment.id}', '${escapeHtml(comment.authorName || 'пользователь')}')">
                    <span class="material-icons" style="font-size:16px;">reply</span> Ответить
                </button>
                ${comment.authorId === currentUser?.uid ? `
                    <button onclick="deleteComment('${comment.id}')" style="color:var(--red);">
                        <span class="material-icons" style="font-size:16px;">delete</span>
                    </button>
                ` : ''}
            </div>
            
            <div class="comment-reply-form hidden" id="replyForm-${comment.id}">
                <input type="text" id="replyInput-${comment.id}" placeholder="Напишите ответ... @${comment.authorName || 'пользователь'}">
                <button onclick="submitReply('${comment.id}')">Ответить</button>
            </div>
        </div>
    `;
}

function scrollToComment(commentId) {
    const el = document.getElementById(`comment-${commentId}`);
    if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.background = 'var(--accent-light)';
        setTimeout(() => {
            el.style.background = 'transparent';
        }, 2000);
    }
}

function showReplyForm(commentId, authorName) {
    const form = document.getElementById(`replyForm-${commentId}`);
    if (form) {
        form.classList.toggle('hidden');
        if (!form.classList.contains('hidden')) {
            const input = document.getElementById(`replyInput-${commentId}`);
            if (input) {
                input.placeholder = `Ответ @${authorName}`;
                input.focus();
            }
        }
    }
}

function submitReply(parentId) {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    
    const input = document.getElementById(`replyInput-${parentId}`);
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    
    // Находим имя автора родительского комментария
    let parentAuthorName = null;
    const findParent = (list) => {
        for (const c of list) {
            if (c.id === parentId) {
                parentAuthorName = c.authorName;
                return true;
            }
            if (c.replies && c.replies.length) {
                if (findParent(c.replies)) return true;
            }
        }
        return false;
    };
    findParent(comments);
    
    const commentData = {
        postId: postId,
        parentId: parentId,
        authorId: currentUser.uid,
        authorName: currentUser.displayName || 'Аноним',
        authorAvatar: currentUser.photoURL || null,
        text: text,
        images: [],
        likes: [],
        dislikes: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    db.collection('comments').add(commentData)
        .then(() => {
            input.value = '';
            document.getElementById(`replyForm-${parentId}`).classList.add('hidden');
            loadComments(postId);
            updateCommentCount();
        })
        .catch(err => alert('Ошибка: ' + err.message));
}

function submitComment() {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    
    const textarea = document.getElementById('commentInput');
    const text = textarea.value.trim();
    if (!text && commentImages.length === 0) return;
    
    const btn = document.getElementById('submitCommentBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="material-icons" style="animation:spin 1s linear infinite;font-size:16px;">refresh</span>';
    
    const commentData = {
        postId: postId,
        parentId: null,
        authorId: currentUser.uid,
        authorName: currentUser.displayName || 'Аноним',
        authorAvatar: currentUser.photoURL || null,
        text: text || '',
        images: commentImages.slice(),
        likes: [],
        dislikes: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    
    db.collection('comments').add(commentData)
        .then(() => {
            textarea.value = '';
            commentImages = [];
            document.getElementById('commentImagesPreview').innerHTML = '';
            document.getElementById('commentImageInput').value = '';
            loadComments(postId);
            updateCommentCount();
        })
        .catch(err => alert('Ошибка: ' + err.message))
        .finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<span class="material-icons" style="font-size:16px;">send</span> Отправить';
        });
}

function voteComment(commentId, direction) {
    if (!currentUser) {
        window.location.href = '/login.html';
        return;
    }
    
    // Мгновенное обновление UI (рекурсивный поиск)
    const findAndUpdate = (list) => {
        for (const c of list) {
            if (c.id === commentId) {
                const uid = currentUser.uid;
                const wasLiked = c.likes && c.likes.includes(uid);
                const wasDisliked = c.dislikes && c.dislikes.includes(uid);
                if (direction === 1) {
                    if (wasLiked) {
                        c.likes = c.likes.filter(id => id !== uid);
                    } else {
                        c.likes = [...(c.likes || []), uid];
                        if (wasDisliked) c.dislikes = c.dislikes.filter(id => id !== uid);
                    }
                } else {
                    if (wasDisliked) {
                        c.dislikes = c.dislikes.filter(id => id !== uid);
                    } else {
                        c.dislikes = [...(c.dislikes || []), uid];
                        if (wasLiked) c.likes = c.likes.filter(id => id !== uid);
                    }
                }
                return true;
            }
            if (c.replies && c.replies.length) {
                if (findAndUpdate(c.replies)) return true;
            }
        }
        return false;
    };
    findAndUpdate(comments);
    renderComments();
    
    // Отправка в БД (фоном)
    const commentRef = db.collection('comments').doc(commentId);
    db.runTransaction(transaction => {
        return transaction.get(commentRef).then(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            const likes = data.likes || [];
            const dislikes = data.dislikes || [];
            const uid = currentUser.uid;
            
            let newLikes = likes.filter(id => id !== uid);
            let newDislikes = dislikes.filter(id => id !== uid);
            
            if (direction === 1) {
                if (!likes.includes(uid)) newLikes.push(uid);
            } else if (direction === -1) {
                if (!dislikes.includes(uid)) newDislikes.push(uid);
            }
            
            transaction.update(commentRef, {
                likes: newLikes,
                dislikes: newDislikes
            });
        });
    }).catch(err => console.error('Vote comment error:', err));
}

function deleteComment(commentId) {
    if (!currentUser) return;
    if (!confirm('Удалить комментарий?')) return;
    
    db.collection('comments').doc(commentId).delete()
        .then(() => {
            loadComments(postId);
            updateCommentCount();
        })
        .catch(err => alert('Ошибка: ' + err.message));
}

function updateCommentCount() {
    if (!currentPost) return;
    db.collection('comments').where('postId', '==', postId).get()
        .then(snapshot => {
            const count = snapshot.size;
            db.collection('posts').doc(postId).update({ commentsCount: count });
            currentPost.commentsCount = count;
            const el = document.getElementById('commentsCount');
            if (el) el.textContent = count;
        });
}

// ============================================================
// COMMENT IMAGES
// ============================================================
function addCommentImage() {
    document.getElementById('commentImageInput').click();
}

function handleCommentImageUpload(event) {
    const files = event.target.files;
    if (!files || !files.length) return;
    if (commentImages.length + files.length > 10) {
        alert('Максимум 10 изображений в комментарии');
        return;
    }
    
    const total = files.length;
    let completed = 0;
    
    Array.from(files).forEach(file => {
        if (file.size > 10 * 1024 * 1024) {
            alert(`Файл ${file.name} слишком большой (>10MB)`);
            completed++;
            checkComplete();
            return;
        }
        
        const formData = new FormData();
        formData.append('key', IMGBB_API_KEY);
        formData.append('image', file);
        
        fetch('https://api.imgbb.com/1/upload', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                commentImages.push(data.data.url);
                renderCommentImagesPreview();
            } else {
                alert('Ошибка загрузки: ' + (data.error?.message || 'Unknown'));
            }
        })
        .catch(err => {
            alert('Ошибка: ' + err.message);
        })
        .finally(() => {
            completed++;
            checkComplete();
        });
    });
    
    function checkComplete() {
        if (completed >= total) {
            document.getElementById('commentImageInput').value = '';
        }
    }
}

function renderCommentImagesPreview() {
    const container = document.getElementById('commentImagesPreview');
    container.innerHTML = commentImages.map((url, i) => `
        <div class="img-wrap">
            <img src="${url}" alt="comment image" loading="lazy">
            <button class="remove-img" onclick="removeCommentImage(${i})">×</button>
        </div>
    `).join('');
}

function removeCommentImage(index) {
    commentImages.splice(index, 1);
    renderCommentImagesPreview();
}
