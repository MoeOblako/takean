<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Takean - Главная</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ===== ВСЕ СТИЛИ КАК РАНЬШЕ ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: #1c1c1c;
            --bg-hover: #2a2a2a;
            --bg-input: #252525;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --text-muted: #6b6b6b;
            --border-color: #2c2c2c;
            --border-light: #3a3a3a;
            --accent: #4f8cff;
            --accent-hover: #6b9fff;
            --accent-light: rgba(79, 140, 255, 0.15);
            --green: #4caf50;
            --red: #f44336;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            --radius: 4px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --topbar-height: 60px;
            --online-color: #4caf50;
            --tag-anarchism-color: #ffffff;
            --tag-fascism-color: #ffffff;
            --tag-authoritarianism-color: #8b0000;
        }

        [data-theme="light"] {
            --bg-primary: #f0f0f0;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #e8e8e8;
            --bg-input: #f0f0f0;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --border-color: #e0e0e0;
            --border-light: #d0d0d0;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --tag-anarchism-color: #000000;
            --tag-fascism-color: #000000;
            --tag-authoritarianism-color: #8b0000;
        }

        html {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: var(--radius); }

        .container { max-width: 900px; margin: 0 auto; padding: 0 16px; width: 100%; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .flex-col { display: flex; flex-direction: column; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .gap-16 { gap: 16px; }
        .gap-24 { gap: 24px; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }

        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.4; }
            100% { transform: scale(4); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-fade { animation: fadeIn 0.25s ease-out; }
        .animate-slide { animation: slideUp 0.3s ease-out; }

        /* ===== RIPPLE BUTTON ===== */
        .ripple-btn {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
            background: none;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius);
            transition: background 0.2s, transform 0.1s;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .ripple-btn .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            animation: ripple 0.5s ease-out;
            pointer-events: none;
        }

        [data-theme="light"] .ripple-btn .ripple-effect {
            background: rgba(0, 0, 0, 0.1);
        }

        .ripple-btn:hover { background: var(--bg-hover); }
        .ripple-btn:active { transform: scale(0.96); }

        .ripple-btn.primary {
            background: var(--accent);
            color: #fff;
        }
        .ripple-btn.primary:hover { background: var(--accent-hover); }

        .ripple-btn.outline {
            border: 1px solid var(--border-color);
        }
        .ripple-btn.outline:hover { background: var(--bg-hover); }

        /* ===== TOP BAR ===== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 0;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            min-height: var(--topbar-height);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .topbar-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .topbar-logo span { color: var(--accent); }

        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .topbar-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar-nav a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .topbar-nav a.active {
            color: var(--accent);
            background: var(--accent-light);
        }

        .topbar-nav a .material-icons { font-size: 20px; }
        .topbar-nav a span:not(.material-icons) { display: inline; }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .topbar-actions .material-icons {
            font-size: 22px;
            color: var(--text-secondary);
        }

        .topbar-actions .avatar-small {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .topbar-actions .avatar-small:hover {
            border-color: var(--accent);
        }

        .topbar-actions .avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .topbar-actions .avatar-small .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
            z-index: 2;
        }

        .topbar-actions .avatar-small .online-dot.show {
            display: block;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            max-width: 160px;
        }

        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-bar input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            padding: 6px 6px;
            width: 100%;
            min-width: 60px;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
            font-size: 12px;
        }

        .search-bar .material-icons {
            color: var(--text-muted);
            font-size: 18px;
        }

        /* ===== POST CARD ===== */
        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            animation: fadeIn 0.3s ease-out;
        }

        .post-card:hover {
            border-color: var(--border-light);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-avatar .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
            background: var(--online-color);
            display: none;
            z-index: 2;
        }

        .post-avatar .online-dot.show {
            display: block;
        }

        .post-user {
            display: flex;
            flex-direction: column;
            gap: 1px;
            flex: 1;
            min-width: 0;
        }

        .post-username {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .post-username:hover { color: var(--accent); }

        .post-badge {
            font-size: 10px;
            background: var(--accent-light);
            color: var(--accent);
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .post-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
            margin-top: 2px;
        }

        .post-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        .post-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            transition: all 0.2s;
        }

        .post-tag:hover { 
            opacity: 0.8;
            transform: scale(1.02);
        }

        .post-community-wrap {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            margin-left: 2px;
        }

        .post-community-wrap:hover {
            color: var(--accent);
        }

        .post-community-wrap .community-avatar {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--bg-hover);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .post-community-wrap .community-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-community-wrap .community-name {
            color: var(--text-primary);
            font-weight: 500;
        }

        .post-title {
            font-size: 16px;
            font-weight: 700;
            margin: 6px 0 8px;
            line-height: 1.4;
            color: var(--text-primary);
            cursor: pointer;
        }

        .post-title:hover { color: var(--accent); }

        .post-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .post-content .mention {
            color: var(--accent);
            font-weight: 500;
            cursor: pointer;
        }

        .post-content .mention:hover { text-decoration: underline; }

        .post-images {
            display: grid;
            gap: 4px;
            margin: 8px 0;
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
        }

        .post-images .img-wrap {
            position: relative;
            background: var(--bg-hover);
            overflow: hidden;
            cursor: pointer;
            border-radius: var(--radius);
        }

        .post-images .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .post-images .img-wrap:hover img { transform: scale(1.02); }

        .post-images .img-wrap .image-count {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 600;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .post-action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .post-action-btn:hover { background: var(--bg-hover); }
        .post-action-btn .material-icons { font-size: 18px; }

        .post-action-btn.liked { color: var(--green); }
        .post-action-btn.liked .material-icons { font-variation-settings: 'FILL' 1; }
        .post-action-btn.disliked { color: var(--red); }
        .post-action-btn.disliked .material-icons { font-variation-settings: 'FILL' 1; }

        .post-score {
            font-weight: 700;
            font-size: 14px;
            min-width: 24px;
            text-align: center;
            color: var(--text-primary);
        }

        .post-score.positive { color: var(--green); }
        .post-score.negative { color: var(--red); }

        /* ===== SORT FILTERS ===== */
        .feed-filters {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 4px;
            flex-wrap: nowrap;
        }

        .feed-filters .filter-btn {
            padding: 6px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }

        .feed-filters .filter-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .feed-filters .filter-btn.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
        }

        /* ===== ЦВЕТА ДЛЯ ТЕГОВ ===== */
        .tag-communism { color: #c62828; }
        .tag-socialism { color: #d32f2f; }
        .tag-capitalism { color: #2e7d32; }
        .tag-liberalism { color: #1e88e5; }
        .tag-conservatism { color: #3949ab; }
        .tag-anarchism { color: var(--tag-anarchism-color); }
        .tag-nationalism { color: #1565c0; }
        .tag-fascism { color: var(--tag-fascism-color); }
        .tag-democracy { color: #1565c0; }
        .tag-authoritarianism { color: var(--tag-authoritarianism-color); }
        .tag-minecraft { color: #4caf50; }
        .tag-dota2 { color: #d32f2f; }
        .tag-csgo { color: #f9a825; }

        .tag-cyberpunk { color: #7b1fa2; }
        .tag-indie { color: #ef6c00; }

        .tag-space { color: #1a237e; }

        .tag-math { color: #4e342e; }
        .tag-psychology { color: #7b1fa2; }

        /* ===== AUTH MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease-out;
            padding: 16px;
        }

        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.25s ease-out;
        }

        .modal-box h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .modal-box .field {
            margin-bottom: 14px;
        }

        .modal-box .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .modal-box .field input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal-box .field input:focus {
            border-color: var(--accent);
        }

        .modal-box .field .input-prefix {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .modal-box .field .input-prefix span {
            padding: 10px 12px;
            color: var(--text-muted);
            font-weight: 500;
            background: var(--bg-hover);
            border-right: 1px solid var(--border-color);
        }

        .modal-box .field .input-prefix input {
            border: none;
            border-radius: 0;
            background: none;
            padding: 10px 12px;
        }

        .modal-box .field .input-prefix input:focus {
            border-color: transparent;
            box-shadow: none;
        }

        .modal-box .checkbox-field {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .modal-box .checkbox-field input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .modal-box .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            color: var(--text-muted);

// ============================================================
// BBC ПАРСЕР
// ============================================================
function parseBBC(text) {
    if (!text) return '';
    
    let html = escapeHtml(text);
    
    html = html.replace(/\[b\](.*?)\[\/b\]/g, '<span class="bbc-bold">$1</span>');
    html = html.replace(/\[i\](.*?)\[\/i\]/g, '<span class="bbc-italic">$1</span>');
    html = html.replace(/\[u\](.*?)\[\/u\]/g, '<span class="bbc-underline">$1</span>');
    html = html.replace(/\[s\](.*?)\[\/s\]/g, '<span class="bbc-strike">$1</span>');
    html = html.replace(/\[code\](.*?)\[\/code\]/g, '<span class="bbc-code">$1</span>');
    html = html.replace(/\[quote\](.*?)\[\/quote\]/g, '<div class="bbc-quote">$1</div>');
    html = html.replace(/\[spoiler\](.*?)\[\/spoiler\]/g, '<span class="bbc-spoiler" onclick="event.stopPropagation();this.style.color=\'var(--text-primary)\';">$1</span>');
    html = html.replace(/\[size=small\](.*?)\[\/size\]/g, '<span class="bbc-size-small">$1</span>');
    html = html.replace(/\[size=normal\](.*?)\[\/size\]/g, '<span class="bbc-size-normal">$1</span>');
    html = html.replace(/\[size=large\](.*?)\[\/size\]/g, '<span class="bbc-size-large">$1</span>');
    html = html.replace(/\[size=huge\](.*?)\[\/size\]/g, '<span class="bbc-size-huge">$1</span>');
    html = html.replace(/\[color=(#[0-9a-fA-F]{6})\](.*?)\[\/color\]/g, '<span class="bbc-color" style="color:$1;">$2</span>');
    html = html.replace(/\[bg=(#[0-9a-fA-F]{6})\](.*?)\[\/bg\]/g, '<span class="bbc-bg" style="background:$1;padding:2px 4px;border-radius:var(--radius);">$2</span>');
    html = html.replace(/\[url\](.*?)\[\/url\]/g, '<a href="$1" target="_blank" style="color:var(--accent);">$1</a>');
    html = html.replace(/\[url=(.*?)\](.*?)\[\/url\]/g, '<a href="$1" target="_blank" style="color:var(--accent);">$2</a>');
    html = html.replace(/\[img\](.*?)\[\/img\]/g, '<img src="$1" style="max-width:100%;max-height:300px;border-radius:var(--radius);margin:4px 0;" loading="lazy">');
    
    html = html.replace(/@([a-zA-Z0-9_.-]+)/g, '<span class="mention" onclick="goToProfileByUsername(\'$1\')">@$1</span>');
    
    html = html.replace(/\n/g, '<br>');
    
    return html;
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================================
// ОНЛАЙН СТАТУС (УМНАЯ СИСТЕМА)
// ============================================================
function updateLastActivity() {
    lastActivityTime = Date.now();
    if (!isUserOnline && currentUser) {
        isUserOnline = true;
        updateOnlineStatus(true);
    }
}

function updateOnlineStatus(status) {
    if (!currentUser) return;
    db.collection('users').doc(currentUser.uid).update({
        lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
        isOnline: status
    }).catch(() => {});
}

function checkOnlineStatus() {
    if (!currentUser) return;
    
    const now = Date.now();
    const inactiveTime = (now - lastActivityTime) / 1000; // в секундах
    
    // Если прошло больше 120 секунд (2 минуты) бездействия
    if (inactiveTime > 120 && isUserOnline) {
        isUserOnline = false;
        updateOnlineStatus(false);
    }
}

function startOnlineTracking() {
    if (onlineCheckInterval) clearInterval(onlineCheckInterval);
    
    lastActivityTime = Date.now();
    isUserOnline = true;
    updateOnlineStatus(true);
    
    // Проверяем бездействие каждые 30 секунд
    onlineCheckInterval = setInterval(checkOnlineStatus, 30000);
    
    // Отслеживаем активность пользователя
    const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'click', 'input', 'focus'];
    events.forEach(event => {
        document.addEventListener(event, updateLastActivity);
    });
    
    // При закрытии вкладки
    window.addEventListener('beforeunload', () => {
        if (currentUser) {
            db.collection('users').doc(currentUser.uid).update({
                isOnline: false,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});
        }
    });
    
    // При скрытии вкладки
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            if (currentUser) {
                isUserOnline = false;
                db.collection('users').doc(currentUser.uid).update({
                    isOnline: false,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
            }
        } else {
            // Вкладка снова активна — обновляем статус
            lastActivityTime = Date.now();
            isUserOnline = true;
            updateOnlineStatus(true);
        }
    });
}

function checkUserOnline(uid) {
    return db.collection('users').doc(uid).get()
        .then(doc => {
            if (doc.exists) {
                const data = doc.data();
                // Проверяем isOnline и lastSeen
                if (data.isOnline === true) return true;
                if (data.lastSeen) {
                    const lastSeen = data.lastSeen.seconds * 1000;
                    const now = Date.now();
                    return (now - lastSeen) < 120000; // 2 минуты
                }
            }
            return false;
        })
        .catch(() => false);
}

function createUserInFirestore(user) {
    return db.collection('users').doc(user.uid).get().then(doc => {
        if (!doc.exists) {
            let username = user.displayName || 'user_' + Date.now().toString(36);
            username = username.toLowerCase().replace(/[^a-z0-9_.-]/g, '');
            if (!username || username.length < 2) {
                username = 'user_' + Date.now().toString(36);
            }
            return db.collection('users').doc(user.uid).set({
                username: username,
                displayName: user.displayName || username,
                email: user.email || '',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                avatar: user.photoURL || null,
                cover: null,
                bio: '',

function setupEventListeners() {

        if (e.key === 'Enter') {
            const q = document.getElementById('globalSearch').value.trim();
            if (q) window.location.href = `/search.html?q=${encodeURIComponent(q)}`;
        }
    });

    document.querySelectorAll('#feedFilters .filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#feedFilters .filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            loadFeed();
        });
    });

    document.getElementById('authModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('authModal')) closeAuthModal();
    });

function loadUserData() {
    const user = auth.currentUser;
    currentUser = user;
    
    const avatarEl = document.getElementById('userAvatar');
    const dotEl = document.getElementById('userOnlineDot');
    
    if (user) {
        avatarEl.innerHTML = user.photoURL 
            ? `<img src="${user.photoURL}" alt="avatar">` 
            : `<span>${(user.displayName || '?')[0].toUpperCase()}</span>`;
        avatarEl.onclick = () => window.location.href = `/profile.html?uid=${user.uid}`;
        
        createUserInFirestore(user).then(() => {

        avatarEl.onclick = () => openAuthModal();

function loadFeed() {
    const container = document.getElementById('feedContainer');
    container.innerHTML = '<div class="loading-spinner"><span class="material-icons">refresh</span> Загрузка...</div>';

    let query = db.collection('posts');
    
    if (currentFilter === 'popular') {
        query = query.orderBy('likes', 'desc');
    } else if (currentFilter === 'new') {
        query = query.orderBy('createdAt', 'desc');
    } else if (currentFilter !== 'all' && ['politics', 'games', 'tech', 'science'].includes(currentFilter)) {
        query = query.where('category', '==', currentFilter);
    } else {
        query = query.orderBy('createdAt', 'desc');
    }
    
    query.limit(50).get()
        .then(snapshot => {
            const posts = [];
            const promises = [];
            snapshot.forEach(doc => {
                posts.push({ id: doc.id, ...doc.data() });
            });
            feedPosts = posts;
            
            posts.forEach(post => {
                if (post.communityId) {
                    promises.push(
                        db.collection('communities').doc(post.communityId).get()
                            .then(doc => {
                                if (doc.exists) {
                                    post._communityData = doc.data();
                                }
                            })
                            .catch(() => {})
                    );
                }
                if (post.authorId) {
                    promises.push(
                        checkUserOnline(post.authorId).then(isOnline => {
                            post._authorOnline = isOnline;
                        })
                    );
                }
            });
            
            return Promise.all(promises);
        })
        .then(() => {
            renderFeed(feedPosts);
        })
        .catch(err => {
            container.innerHTML = `
                <div style="text-align:center;padding:40px;color:var(--text-muted);">
                    <span class="material-icons" style="font-size:48px;display:block;margin-bottom:12px;">error</span>
                    <h3 style="font-weight:500;">Ошибка загрузки</h3>
                    <p style="font-size:14px;">${err.message}</p>
                    <button class="ripple-btn primary" style="margin-top:12px;" onclick="loadFeed()">
                        <span class="material-icons">refresh</span> Обновить
                    </button>
                </div>
            `;
        });
}

function createPostHTML(post, index) {
    const isLiked = post.likes && currentUser && post.likes.includes(currentUser.uid);
    const isDisliked = post.dislikes && currentUser && post.dislikes.includes(currentUser.uid);
    const score = (post.likes?.length || 0) - (post.dislikes?.length || 0);
    const scoreClass = score > 0 ? 'positive' : score < 0 ? 'negative' : '';
    const isOnline = post._authorOnline || false;
    const communityName = post._communityData?.name || post.community || '';
    const communityAvatar = post._communityData?.avatar || '';
    
    const timeStr = post.createdAt 
        ? new Date(post.createdAt.seconds * 1000).toLocaleString('ru-RU', { 
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          })
        : 'недавно';
    
    // Теги
    let tagsHtml = '';
    if (post.category) {
        const categories = post.category.split(',').map(c => c.trim());
        categories.forEach(cat => {
            const tagClass = getTagClass(cat);
            const displayName = getTagDisplayName(cat);
            tagsHtml += `<span class="post-tag ${tagClass}" onclick="applyFilter('${cat}')">#${displayName}</span>`;
        });
    }
    
    // Сообщество
    let communityHtml = '';
    if (post.communityId && post._communityData) {
        communityHtml = `
            <span class="post-community-wrap" onclick="goToCommunity('${post.communityId}')">
                <span class="material-icons" style="font-size:14px;color:var(--text-muted);">arrow_forward</span>
                <span class="community-avatar">
                    ${communityAvatar ? `<img src="${communityAvatar}" alt="">` : `<span class="material-icons" style="font-size:12px;">group</span>`}
                </span>
                <span class="community-name">${escapeHtml(communityName)}</span>
            </span>
        `;
    } else if (post.community) {
        communityHtml = `
            <span class="post-community-wrap">
                <span class="material-icons" style="font-size:14px;color:var(--text-muted);">arrow_forward</span>
                <span class="community-name">${escapeHtml(post.community)}</span>
            </span>
        `;
    }
    
    // Изображения
    let imagesHtml = '';
    if (post.images && post.images.length) {
        const count = post.images.length;
        if (count === 1) {
            imagesHtml = `
                <div class="post-images" onclick="openPost('${post.id}')">
                    <div class="img-wrap" onclick="event.stopPropagation(); openImageViewer('${post.images[0]}')">
                        <img src="${post.images[0]}" alt="post image" loading="lazy">
                    </div>
                </div>
            `;
        } else if (count === 2) {
            imagesHtml = `
                <div class="post-images" style="grid-template-columns:1fr 1fr;" onclick="openPost('${post.id}')">
                    ${post.images.slice(0, 2).map(img => `
                        <div class="img-wrap" onclick="event.stopPropagation(); openImageViewer('${img}')">
                            <img src="${img}" alt="post image" loading="lazy">
                        </div>
                    `).join('')}
                </div>
            `;
        } else if (count === 3) {
            imagesHtml = `
                <div class="post-images" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;" onclick="openPost('${post.id}')">
                    <div class="img-wrap" style="grid-row:1/3;" onclick="event.stopPropagation(); openImageViewer('${post.images[0]}')">
                        <img src="${post.images[0]}" alt="post image" loading="lazy">
                    </div>
                    ${post.images.slice(1, 3).map(img => `
                        <div class="img-wrap" onclick="event.stopPropagation(); openImageViewer('${img}')">
                            <img src="${img}" alt="post image" loading="lazy">
                        </div>
                    `).join('')}
                </div>
            `;
        } else {
            imagesHtml = `
                <div class="post-images" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;" onclick="openPost('${post.id}')">
                    ${post.images.slice(0, 4).map((img, i) => `
                        <div class="img-wrap" onclick="event.stopPropagation(); openImageViewer('${img}')">
                            <img src="${img}" alt="post image" loading="lazy">
                            ${i === 3 && count > 4 ? `<span class="image-count">+${count - 4}</span>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }
    }
    
    return `
        <div class="post-card" data-id="${post.id}">
            <div class="post-header">
                <div class="post-avatar" onclick="goToProfile('${post.authorId}')">
                    ${post.authorAvatar 
                        ? `<img src="${post.authorAvatar}" alt="">` 
                        : `<span>${(post.authorName || '?')[0].toUpperCase()}</span>`}
                    <span class="online-dot ${isOnline ? 'show' : ''}"></span>
                </div>
                <div class="post-user">
                    <div class="post-username" onclick="goToProfile('${post.authorId}')">
                        ${escapeHtml(post.authorName || 'Аноним')}
                        ${post.authorBadge ? `<span class="post-badge">${escapeHtml(post.authorBadge)}</span>` : ''}
                    </div>
                    <div class="post-meta">
                        <span class="post-time">${timeStr}</span>
                        ${communityHtml}
                    </div>
                    ${tagsHtml ? `<div class="post-tags">${tagsHtml}</div>` : ''}
                </div>
            </div>
            
            <div class="post-title" onclick="openPost('${post.id}')">${escapeHtml(post.title || 'Без заголовка')}</div>
            
            <div class="post-content" onclick="openPost('${post.id}')">
                ${parseBBC(post.content || '')}
            </div>
            
            ${imagesHtml}
            
            <div class="post-actions">
                <button class="post-action-btn ${isLiked ? 'liked' : ''}" onclick="votePost('${post.id}', 1, this)">
                    <span class="material-icons">thumb_up</span>
                    <span class="vote-count">${post.likes?.length || 0}</span>
                </button>
                <button class="post-action-btn ${isDisliked ? 'disliked' : ''}" onclick="votePost('${post.id}', -1, this)">
                    <span class="material-icons">thumb_down</span>
                    <span class="vote-count">${post.dislikes?.length || 0}</span>
                </button>
                <span class="post-score ${scoreClass}">${score}</span>
                <button class="post-action-btn" onclick="openPost('${post.id}')">
                    <span class="material-icons">comment</span>
                    ${post.commentsCount || 0}
                </button>
                <button class="post-action-btn" onclick="sharePost('${post.id}')">
                    <span class="material-icons">share</span>
                </button>
                ${currentUser && post.authorId === currentUser.uid ? `
                    <button class="post-action-btn" onclick="deletePost('${post.id}')" style="color:var(--red);">
                        <span class="material-icons">delete</span>
                    </button>
                ` : ''}
            </div>
        </div>
    `;
}

// ============================================================
// VOTE SYSTEM (мгновенное обновление)
// ============================================================
function votePost(postId, direction, btn) {
    if (!currentUser) {
        openAuthModal(() => votePost(postId, direction, btn));
        return;
    }
    
    const post = feedPosts.find(p => p.id === postId);
    if (!post) return;
    
    const uid = currentUser.uid;
    const wasLiked = post.likes && post.likes.includes(uid);
    const wasDisliked = post.dislikes && post.dislikes.includes(uid);
    
    if (direction === 1) {
        if (wasLiked) {
            post.likes = post.likes.filter(id => id !== uid);
        } else {
            post.likes = [...(post.likes || []), uid];
            if (wasDisliked) {
                post.dislikes = post.dislikes.filter(id => id !== uid);
            }
        }
    } else if (direction === -1) {
        if (wasDisliked) {
            post.dislikes = post.dislikes.filter(id => id !== uid);
        } else {
            post.dislikes = [...(post.dislikes || []), uid];
            if (wasLiked) {
                post.likes = post.likes.filter(id => id !== uid);
            }
        }
    }
    
    renderFeed(feedPosts);
    
    const postRef = db.collection('posts').doc(postId);
    db.runTransaction(transaction => {
        return transaction.get(postRef).then(doc => {
            if (!doc.exists) return;
            const data = doc.data();
            const likes = data.likes || [];
            const dislikes = data.dislikes || [];
            
            let newLikes = likes.filter(id => id !== uid);
            let newDislikes = dislikes.filter(id => id !== uid);
            
            if (direction === 1) {
                if (!likes.includes(uid)) newLikes.push(uid);
            } else if (direction === -1) {
                if (!dislikes.includes(uid)) newDislikes.push(uid);
            }
            
            transaction.update(postRef, {
                likes: newLikes,
                dislikes: newDislikes
            });
        });
    }).catch(err => console.error('Vote error:', err));
}

}

function goToProfileByUsername(username) {
    db.collection('users').where('username', '==', username).get()
        .then(snapshot => {
            if (!snapshot.empty) {
                window.location.href = `/profile.html?uid=${snapshot.docs[0].id}`;
            }
        })
        .catch(() => {});
}

function goToCommunity(communityId) {
    if (!communityId) return;
    window.location.href = `/community.html?id=${communityId}`;
}

function applyFilter(filter) {
    document.querySelectorAll('#feedFilters .filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`#feedFilters .filter-btn[data-filter="${filter}"]`)?.classList.add('active');
    currentFilter = filter;
    loadFeed();
}

function sharePost(postId) {
    const url = window.location.origin + `/post.html?id=${postId}`;
    if (navigator.share) {
        navigator.share({ title: 'Тейк на Takean', url });
    } else {
        navigator.clipboard.writeText(url).then(() => {
            alert('Ссылка скопирована!');
        }).catch(() => {
            prompt('Скопируйте ссылку:', url);
        });
    }
}

function deletePost(postId) {
    if (!currentUser) return;
    if (!confirm('Удалить этот тейк?')) return;
    
    db.collection('posts').doc(postId).delete()
        .then(() => {
            feedPosts = feedPosts.filter(p => p.id !== postId);
            renderFeed(feedPosts);
        })
        .catch(err => alert('Ошибка: ' + err.message));
}

console.log('🏠 Takean Home page loaded');
</script>
